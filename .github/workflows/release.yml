name: Release-Binaries

# Baut die eigenständigen Mietfuchs-Programmdateien, prüft jede auf einem echten Rechner ihres
# Systems und hängt sie erst dann ans GitHub-Release (#22). Läuft bei einem Tag wie v0.1.2, bei
# PRs, die Server, Oberfläche, Programmfenster oder Build ändern, und von Hand.
#
# Daneben entstehen das Programmfenster (#517: Installer für Windows, .dmg für macOS) und das
# Store-Paket, das seit #517 das Fenster enthält. Im Fenster läuft der Server als eine gebündelte
# Datei mit Electrons eigenem Node, ohne Programmdatei.
#
# Bun kompiliert alle Ziele von einem einzigen Linux-Runner aus. Ob eine Datei auf ihrem
# System wirklich startet, zeigt aber erst ein Rechner mit diesem System: Genau so ein Fehler
# (gescannte PDFs, #21) fiel sonst erst bei Nutzern auf.
#
# Was ein Pull Request auslässt, steht hier beisammen (#52): die volle Liste der Distributionen
# und Pakete, die lange KI-Antwort unter Node und das lange Warten bei den Programmdateien. Ein
# PR prüft davon eine Auswahl, der Tag alles, und nichts geht ans Release, was nicht geprüft
# ist. Wer die volle Breite schon vor dem Merge will, hängt dem PR das Label „full-check“
# an; das startet diesen Workflow neu, dann mit allem. Dazu läuft einmal die Woche derselbe
# volle Umfang von selbst, siehe „schedule“ unten.
on:
  push:
    tags:
      - 'v*'

  # Das Netz für alles, was ein Pull Request nicht mehr prüft (#52), vor allem für die lange
  # KI-Antwort: Sie prüft, dass eine Antwort noch ankommt, wenn der Anbieter länger als fünf
  # Minuten schweigt, und das hängt bei der Programmdatei an Bun. Bun wird bewusst mit `latest`
  # gebaut, kann sich also jeden Tag ändern, und ohne diesen Lauf fiele eine kaputte Fassung
  # erst beim Tag auf, wenn das Release schon halb gebaut ist. Genau das schließt #52 aus.
  # Wöchentlich reicht, weil der Lauf nichts kostet, was ein Entwickler abwartet.
  #
  # Mittwochs 4:23 UTC, also bewusst nicht zur vollen Stunde: Dorthin legen alle ihre Zeitpläne,
  # GitHub verzögert sie dann oder lässt sie ausfallen. Der Lauf nimmt den Standardzweig.
  # Wer ihn löschen will, gibt dieses Netz auf. Achtung: GitHub schaltet Zeitpläne nach 60 Tagen
  # ohne Bewegung im Repo ab, nach einer langen Pause also nachsehen, ob er noch läuft.
  schedule:
    - cron: '23 4 * * 3'
  pull_request:
    # Ohne „types“ gälten nur opened, synchronize und reopened. „labeled“ kommt dazu, damit das
    # Label „full-check“ einen neuen Lauf auslöst. Die Pfadliste gilt auch dafür: An einem
    # PR, der nichts davon anfasst, läuft dieser Workflow gar nicht, und das Label bewirkt
    # nichts. Das ist gewollt, denn dann gibt es auch nichts zu prüfen.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - server/**
      - client/**
      - scripts/**
      - packaging/**
      # Das Programmfenster (#517): Es steckt auch im Store-Paket, und das prüft nur dieser Workflow
      - desktop/**
      - package.json
      - package-lock.json
      - .github/workflows/release.yml
      - .github/workflows/store.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Legt fest, wie breit die Container-Prüfungen laufen, und gibt beide Matrizen als JSON weiter.
  # Ein eigener Job dafür, weil die Matrix eines Jobs nur aus einem Ausdruck kommen kann und der
  # keine Listen aus der Umgebung kennt (in „strategy“ gibt es github, needs, vars und inputs).
  #
  # Die Auswahl für den Pull Request, und warum gerade sie:
  #   centos:7 hat genau glibc 2.17, die Untergrenze der Linux-Programmdatei. Was an der
  #     C-Bibliothek bricht, bricht zuerst hier.
  #   ubuntu:26.04 ist das andere Ende, also die neueste glibc und die neuesten Werkzeuge.
  #     Zusammen spannen die beiden den Bereich auf, in dem alle übrigen Distributionen liegen.
  #   Ubuntu 24.04 mit dem .deb und Fedora mit dem .rpm prüfen die beiden Paketformate, die nFPM
  #     aus derselben Vorschrift baut, dazu den Datenordner des Benutzers, den zweiten Start auf
  #     belegtem Port und das Beenden aus der Oberfläche. Das .deb prüft zusätzlich den
  #     Startmenü-Eintrag, denn nur Debian und Verwandte bringen desktop-file-validate mit.
  #
  # Was ein Pull Request damit nicht sieht und erst der Zeitplan oder der Tag abdeckt: alle
  # Distributionen zwischen den beiden Enden (Debian 11 bis 13, Ubuntu 20.04 und 22.04,
  # AlmaLinux, Rocky, openSUSE und Arch), jede Container-Prüfung auf ARM64, das Arch-Paket sowie
  # das .rpm auf dem älteren openSUSE Leap und auf ARM64. Ein Fehler, der nur eine dieser
  # Umgebungen trifft, fällt also spätestens eine Woche später auf, immer aber vor dem
  # Anhängen ans Release. Die
  # ARM64-Programmdatei selbst prüft weiterhin jeder PR, nämlich im Job „Prüfen auf Linux
  # ARM64“ auf einem ARM-Runner.
  umfang:
    name: Prüfumfang festlegen
    runs-on: ubuntu-24.04
    outputs:
      vollstaendig: ${{ steps.waehlen.outputs.vollstaendig }}
      distributionen: ${{ steps.waehlen.outputs.distributionen }}
      pakete: ${{ steps.waehlen.outputs.pakete }}
    steps:
      - id: waehlen
        env:
          # Vollständig geprüft wird alles außer einem Pull Request ohne das Label
          # „full-check“. Also der Tag, der wöchentliche Zeitplan und der Start von Hand.
          #
          # Bewusst als Ausnahme geschrieben und nicht als Liste der vollen Fälle: Eine Liste
          # vergisst man beim nächsten Auslöser. Genau das wäre hier fast passiert, der
          # Zeitplan hätte still die kleine Auswahl gefahren. So läuft ein neuer Auslöser
          # vollständig, also im Zweifel zu viel statt zu wenig. Der push-Auslöser oben hört nur
          # auf Tags `v*`, ein Push ohne Tag kommt hier gar nicht an. Auf Ereignissen ohne Pull
          # Request ist die Labelliste leer, das ergibt falsch und keinen Fehler.
          VOLLSTAENDIG: >-
            ${{ github.event_name != 'pull_request'
            || contains(github.event.pull_request.labels.*.name, 'full-check') }}
        run: |
          # Jede Distribution unterscheidet sich in der C-Bibliothek und in den mitgelieferten
          # Werkzeugen, deshalb prüft jede die Programmdatei erneut.
          alle_distributionen='[
            {"arch": "x64", "image": "centos:7"},
            {"arch": "x64", "image": "debian:11"},
            {"arch": "x64", "image": "debian:12"},
            {"arch": "x64", "image": "debian:13"},
            {"arch": "x64", "image": "ubuntu:20.04"},
            {"arch": "x64", "image": "ubuntu:22.04"},
            {"arch": "x64", "image": "ubuntu:24.04"},
            {"arch": "x64", "image": "ubuntu:26.04"},
            {"arch": "x64", "image": "fedora:latest"},
            {"arch": "x64", "image": "almalinux:8"},
            {"arch": "x64", "image": "almalinux:10"},
            {"arch": "x64", "image": "rockylinux:9"},
            {"arch": "x64", "image": "opensuse/leap:15.6"},
            {"arch": "x64", "image": "opensuse/tumbleweed"},
            {"arch": "x64", "image": "archlinux:latest"},
            {"arch": "arm64", "image": "centos:7"},
            {"arch": "arm64", "image": "debian:12"},
            {"arch": "arm64", "image": "ubuntu:20.04"},
            {"arch": "arm64", "image": "ubuntu:26.04"},
            {"arch": "arm64", "image": "fedora:latest"},
            {"arch": "arm64", "image": "almalinux:10"},
            {"arch": "arm64", "image": "opensuse/tumbleweed"}
          ]'
          auswahl_distributionen='[
            {"arch": "x64", "image": "centos:7"},
            {"arch": "x64", "image": "ubuntu:26.04"}
          ]'
          alle_pakete='[
            {"name": "Debian 12 (deb)", "image": "debian:12", "arch": "x64", "muster": "*_amd64.deb", "install": "dpkg -i"},
            {"name": "Ubuntu 24.04 (deb)", "image": "ubuntu:24.04", "arch": "x64", "muster": "*_amd64.deb", "install": "dpkg -i", "startmenue": "ja"},
            {"name": "Fedora (rpm)", "image": "fedora:latest", "arch": "x64", "muster": "*.x86_64.rpm", "install": "rpm -i"},
            {"name": "openSUSE Leap 15.6 (rpm)", "image": "opensuse/leap:15.6", "arch": "x64", "muster": "*.x86_64.rpm", "install": "rpm -i"},
            {"name": "Arch Linux", "image": "archlinux:latest", "arch": "x64", "muster": "*-x86_64.pkg.tar.zst", "install": "pacman -U --noconfirm"},
            {"name": "Debian 12 (deb, ARM64)", "image": "debian:12", "arch": "arm64", "muster": "*_arm64.deb", "install": "dpkg -i"},
            {"name": "AlmaLinux 10 (rpm, ARM64)", "image": "almalinux:10", "arch": "arm64", "muster": "*.aarch64.rpm", "install": "rpm -i"}
          ]'
          auswahl_pakete='[
            {"name": "Ubuntu 24.04 (deb)", "image": "ubuntu:24.04", "arch": "x64", "muster": "*_amd64.deb", "install": "dpkg -i", "startmenue": "ja"},
            {"name": "Fedora (rpm)", "image": "fedora:latest", "arch": "x64", "muster": "*.x86_64.rpm", "install": "rpm -i"}
          ]'

          if [ "$VOLLSTAENDIG" = 'true' ]; then
            distributionen=$alle_distributionen
            pakete=$alle_pakete
            beschreibung='volle Matrix (Tag, Zeitplan, Start von Hand oder Label „full-check“)'
          else
            distributionen=$auswahl_distributionen
            pakete=$auswahl_pakete
            beschreibung='Auswahl für den Pull Request (Label „full-check“ prüft alles)'
          fi

          # Sicherung gegen die stille Lücke: Eine Matrix ohne Einträge erzeugt keinen einzigen
          # Job, und GitHub meldet das nicht als Fehler, sondern überspringt den abhängigen Job.
          # Im Überblick sähe das fast aus wie bestanden, geprüft wäre aber nichts. Eine leere
          # Liste ist deshalb hier ein Fehler, bevor sie jemand als grün missversteht.
          anzahl_distributionen=$(printf '%s' "$distributionen" | jq 'length')
          anzahl_pakete=$(printf '%s' "$pakete" | jq 'length')
          if [ "$anzahl_distributionen" -lt 1 ] || [ "$anzahl_pakete" -lt 1 ]; then
            echo "Leere Liste: $anzahl_distributionen Distributionen, $anzahl_pakete Pakete." >&2
            echo "Eine leere Matrix prüft nichts und fiele niemandem auf. Abbruch." >&2
            exit 1
          fi

          # jq prüft dabei das JSON: Ist eine Liste kaputt, scheitert diese Zuweisung und damit
          # der Job, statt eine leere Matrix weiterzureichen.
          distributionen_json=$(printf '%s' "$distributionen" | jq -c '{include: .}')
          pakete_json=$(printf '%s' "$pakete" | jq -c '{include: .}')
          {
            echo "vollstaendig=$VOLLSTAENDIG"
            echo "distributionen=$distributionen_json"
            echo "pakete=$pakete_json"
          } >> "$GITHUB_OUTPUT"

          # In Bericht und Zusammenfassung nachlesbar, was dieser Lauf geprüft hat.
          echo "Umfang: $beschreibung"
          printf '%s' "$distributionen" | jq -r '.[] | "  Distribution: \(.image) (\(.arch))"'
          printf '%s' "$pakete" | jq -r '.[] | "  Paket: \(.name)"'
          {
            echo "### Prüfumfang"
            echo "$beschreibung"
            printf '%s' "$distributionen" | jq -r '.[] | "- Distribution: \(.image) (\(.arch))"'
            printf '%s' "$pakete" | jq -r '.[] | "- Paket: \(.name)"'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Programmdateien bauen
    # Runner bewusst anpinnen (nicht ubuntu-latest) — reproduzierbare Release-Builds.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Node für npm install (Server-/Client-Deps) und den vite-Build des Frontends.
      # Die Programmdateien selbst laufen mit Bun, nicht mit Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Bun für das Kompilieren. Bewusst die neueste Version: Bringt sie einen Fehler mit,
      # fällt er in den Prüfungen unten auf, bevor ein Release entsteht.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Root + server + client installieren (postinstall zieht die Unterpakete mit).
      - name: Abhängigkeiten installieren
        run: npm install

      # Bei einem Tag kommt die Version aus dem Tag in die package.json-Dateien (#166), sonst
      # meldete sich ein Release-Kandidat wie v0.9.0-rc.2 als fertige 0.9.0, und sein Nutzer
      # bekäme die echte 0.9.0 nie angeboten. Abweichen darf nur das Vorab-Suffix; eine andere
      # Basis im Tag bricht den Lauf ab (Begründung in scripts/set-version.mjs). Bei PR, main,
      # Zeitplan und Start von Hand auf einem Zweig bleibt alles, wie es im Commit steht.
      - name: Version aus dem Tag übernehmen
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs

      # Rechtsregister (Heizung PR 1, Entwurf 4.7): Beim Tag bricht der Lauf ab, solange ein Wert
      # im Register nicht an der Quelle geprüft ist (`checked: 'unchecked'`). Im gewöhnlichen
      # Testlauf ist die Prüfung übersprungen, damit eine PR einen ungeprüften Wert eintragen darf.
      # Damit die Sperre nicht still ausfällt (Variable fehlt, Test übersprungen, Lauf trotzdem
      # grün), wird an der Ausgabe geprüft, dass nichts übersprungen wurde und der Sperrtest selbst
      # bestanden hat (Durchsicht von #221, M8; law-release.test.ts hält diesen Schritt fest).
      - name: Rechtsregister geprüft?
        if: github.ref_type == 'tag'
        working-directory: server
        # Ausdrücklich bash: GitHub ruft es dann mit `-eo pipefail` auf, und ein gescheiterter Test
        # geht nicht in `tee` unter.
        shell: bash
        env:
          MIETFUCHS_RELEASE: '1'
        run: |
          node --test --test-reporter=tap test/law-release.test.ts | tee law-release.tap
          grep -qx '# skipped 0' law-release.tap || { echo "::error::Release-Sperre des Rechtsregisters wurde übersprungen"; exit 1; }
          grep -qE '^ok [0-9]+ - Release: kein ungeprüfter Wert im Rechtsregister$' law-release.tap || { echo "::error::Release-Sperre des Rechtsregisters lief nicht"; exit 1; }
          # #318: Schritte je Version für die Titel der Sicherungen vor einem Update (server/src/db/releaseSteps.ts).
          grep -qE '^ok [0-9]+ - Release: RELEASE_STEPS nennt die Schritte dieser Version$' law-release.tap || { echo "::error::RELEASE_STEPS in server/src/db/releaseSteps.ts nennt diese Version nicht"; exit 1; }

      # Frontend bauen, Embed-Modul erzeugen und alle Ziel-Binaries kompilieren.
      - name: Binaries bauen
        run: npm run package

      # Aus denselben Linux-Programmdateien die Installationspakete bauen (#25). nFPM kommt aus
      # seinem Container, der Runner braucht dafür nichts weiter als Docker.
      - name: Linux-Pakete bauen
        run: npm run package:linux

      # Nur Archive, Pakete + .exe verteilen, nicht die rohen macOS/Linux-Binaries: bei einem
      # rohen Download geht das Ausführungs-Bit verloren (#1) — die Archive konservieren es.
      - name: Binaries hochladen (Artefakt)
        uses: actions/upload-artifact@v7
        with:
          name: mietfuchs-ungesigniert
          path: |
            dist-bin/*.zip
            dist-bin/*.tar.gz
            dist-bin/*.exe
            dist-bin/*.deb
            dist-bin/*.rpm
            dist-bin/*.pkg.tar.zst
          if-no-files-found: error

      # Die Windows-Dateien ohne Konsolenfenster für das Programmfenster (#517), das sie in den
      # Installer und ins Store-Paket (#500) mitnimmt. Ein eigenes Artefakt, damit sie nicht roh ans
      # Release geraten: Dort bleibt die gewohnte Datei mit Konsolenfenster.
      - name: Store-Programmdateien hochladen (Artefakt)
        uses: actions/upload-artifact@v7
        with:
          name: mietfuchs-store-programme
          path: dist-bin/store/*.exe
          if-no-files-found: error

  # Bun signiert macOS-Programmdateien beim Cross-Kompilieren unter Linux selbst (ad hoc). Diese
  # Signatur war schon mehrfach fehlerhaft, zuletzt bei der Intel-Datei trotz Bun 1.4.2
  # („invalid signature“, siehe oven-sh/bun#32159). Neuere macOS-Versionen beenden solche
  # Programme sofort. Deshalb auf einem echten Mac neu ad hoc signieren und prüfen.
  signieren:
    name: macOS-Dateien signieren
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-ungesigniert
          path: dist-bin
      - name: Neu signieren und neu verpacken
        working-directory: dist-bin
        run: |
          for archiv in mietfuchs-macos-*.zip; do
            programm="${archiv%.zip}"
            unzip -o "$archiv"
            codesign --force --sign - "$programm"
            codesign --verify --strict --verbose=2 "$programm"
            rm "$archiv"
            zip -j "$archiv" "$programm"   # zip -j erhält das Ausführungs-Bit
            rm "$programm"
          done
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: mietfuchs-binaries
          path: |
            dist-bin/*.zip
            dist-bin/*.tar.gz
            dist-bin/*.exe
            dist-bin/*.deb
            dist-bin/*.rpm
            dist-bin/*.pkg.tar.zst
          if-no-files-found: error

  # Jede Programmdatei auf einem Rechner ihres Systems starten und von außen prüfen
  # (scripts/smoke-test.mjs: Oberfläche, pdf.js-Dateien, KI-Auswertung, Belege, Abrechnung,
  # Backup). Geprüft werden die Archive, die auch Nutzer herunterladen.
  #
  # `slow_ai` lässt das nachgebaute Ollama länger als fünf Minuten schweigen: Bun bricht fetch
  # sonst nach 300 Sekunden ohne Antwort-Header ab, Mietfuchs schaltet das mit einer Bun-eigenen
  # Option ab (#17). Weil Bun mit `latest` baut, prüft das je Betriebssystem ein Lauf. Die
  # Zeitgeber hängen an der Ereignisschleife des Systems (epoll, kqueue, libuv), nicht an der
  # Architektur, deshalb reicht x64 bzw. Apple Silicon.
  #
  # Seit #52 hängt auch dieser lange Lauf am Prüfumfang, und das ist die Stelle, an der ein Pull
  # Request wirklich Wartezeit spart: Der Lauf wartet allein 320 Sekunden, und „Prüfen auf
  # Linux x64“ bestimmte damit mit 10,4 Minuten den längsten Weg eines PRs. Die Abwägung: Der
  # Test prüft, dass eine Antwort noch ankommt, wenn der Anbieter länger als fünf Minuten
  # schweigt. Das hängt an der Laufzeit und der HTTP-Schicht, bei der Programmdatei also an Bun,
  # und Bun wird bewusst mit `latest` gebaut, kann sich also jeden Tag ändern. Weg fällt die
  # Prüfung deshalb nicht, sie rückt ans Release: „Ans Release anhängen“ hängt von diesem Job
  # ab, ein Bun mit kaputtem Verhalten kommt also nicht ins Release. Wer es früher wissen will,
  # hängt dem Pull Request das Label „full-check“ an.
  pruefen:
    name: Prüfen auf ${{ matrix.name }}
    needs: [umfang, signieren]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, runner: ubuntu-24.04, datei: mietfuchs-linux.tar.gz, programm: mietfuchs-linux, slow_ai: --slow-ai 320 }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, datei: mietfuchs-linux-arm64.tar.gz, programm: mietfuchs-linux-arm64 }
          - { name: Windows x64, runner: windows-2025, datei: mietfuchs-win.exe, programm: mietfuchs-win.exe, slow_ai: --slow-ai 320 }
          - { name: Windows ARM64, runner: windows-11-arm, datei: mietfuchs-win-arm64.exe, programm: mietfuchs-win-arm64.exe }
          - { name: macOS Apple Silicon, runner: macos-15, datei: mietfuchs-macos-apple-silicon.zip, programm: mietfuchs-macos-apple-silicon, slow_ai: --slow-ai 320 }
          - { name: macOS Intel, runner: macos-15-intel, datei: mietfuchs-macos-intel.zip, programm: mietfuchs-macos-intel }
    env:
      NKA_PORT: '3001'
      # Kein Test darf das echte GitHub nach Updates fragen
      NKA_UPDATE_URL: http://127.0.0.1:9/kein-internet-im-test
      # Die Angabe für das Prüfskript: beim vollen Umfang „--slow-ai 320“ auf den drei Systemen,
      # die es in der Matrix tragen, sonst leer. Sie steht hier einmal, damit die beiden
      # Startschritte unten sie nur noch einsetzen müssen.
      SLOW_AI: ${{ needs.umfang.outputs.vollstaendig == 'true' && matrix.slow_ai || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Das Prüfskript erwartet die Version aus server/package.json. Beim Tag steht in der
      # Programmdatei die aus dem Tag (siehe „Programmdateien bauen“), also auch hier.
      - name: Version aus dem Tag übernehmen
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-binaries
          path: bin

      - name: Entpacken wie ein Nutzer
        if: runner.os != 'Windows'
        shell: bash
        working-directory: bin
        run: |
          case "${{ matrix.datei }}" in
            *.zip) unzip -o "${{ matrix.datei }}" ;;
            *.tar.gz) tar -xzf "${{ matrix.datei }}" ;;
          esac
          ls -l

      # Die Signatur aus dem Schritt „signieren“ muss nach dem Ein- und Auspacken gültig sein.
      # Ist sie kaputt, beendet macOS das Programm sofort beim Start.
      - name: Signatur prüfen (macOS)
        if: runner.os == 'macOS'
        working-directory: bin
        run: |
          codesign --verify --strict --verbose=2 "${{ matrix.programm }}"
          file "${{ matrix.programm }}"

      - name: Starten und prüfen (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export NKA_DATA_DIR="$RUNNER_TEMP/daten"
          "./bin/${{ matrix.programm }}" > server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; echo "--- Ausgabe der Programmdatei"; cat server.log' EXIT
          node scripts/smoke-test.mjs --url "http://127.0.0.1:$NKA_PORT" --mode binary ${{ env.SLOW_AI }}
          # Ein zweiter Start derselben Programmdatei auf demselben Port, mit Daten, die umsteigen
          # wollen (#244): Er muss mit Code 0 enden, ohne seinen Datenordner anzufassen. Ob Bun den
          # Port auf jedem System exklusiv bindet, zeigt nur dieser Lauf, in jedem Prüfumfang.
          node scripts/second-start.mjs --url "http://127.0.0.1:$NKA_PORT" --program "./bin/${{ matrix.programm }}"

      - name: Starten und prüfen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NKA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'daten'
          $p = Start-Process -FilePath "bin\${{ matrix.programm }}" -PassThru -RedirectStandardOutput server.log -RedirectStandardError server.err
          try {
            node scripts/smoke-test.mjs --url "http://127.0.0.1:$env:NKA_PORT" --mode binary ${{ env.SLOW_AI }}
            if ($LASTEXITCODE -ne 0) { throw "Prüfung auf ${{ matrix.name }} fehlgeschlagen" }
            # Zweiter Start auf demselben Port (#244), siehe den Schritt für Linux und macOS
            node scripts/second-start.mjs --url "http://127.0.0.1:$env:NKA_PORT" --program "bin\${{ matrix.programm }}"
            if ($LASTEXITCODE -ne 0) { throw "Zweiter Start auf ${{ matrix.name }} fehlgeschlagen" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host '--- Ausgabe der Programmdatei'
            Get-Content server.log, server.err -ErrorAction SilentlyContinue
          }

  # Die Linux-Programmdatei braucht nur glibc 2.17 oder neuer. Derselbe Test läuft deshalb in
  # Containern gängiger Distributionen, von CentOS 7 (genau glibc 2.17) bis zu den neuesten.
  # Welche davon dieser Lauf prüft, entscheidet der Job „Prüfumfang festlegen“ oben.
  distributionen:
    name: Prüfen auf ${{ matrix.image }} (${{ matrix.arch }})
    needs: [umfang, signieren]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.umfang.outputs.distributionen) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Das Prüfskript erwartet die Version aus server/package.json. Beim Tag steht in der
      # Programmdatei die aus dem Tag (siehe „Programmdateien bauen“), also auch hier.
      - name: Version aus dem Tag übernehmen
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-binaries
          path: bin
      - name: Im Container starten und prüfen
        shell: bash
        run: |
          datei=mietfuchs-linux${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          tar -xzf "bin/$datei.tar.gz" -C bin
          # --network host: Die Programmdatei erreicht das nachgebaute Ollama des Prüfskripts
          # unter 127.0.0.1, und das Skript erreicht die Programmdatei ebenso.
          docker run -d --name pruefling --network host -v "$PWD/bin:/app:ro" \
            -e NKA_DATA_DIR=/tmp/daten -e NKA_PORT=3001 -e CI=true \
            -e NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test \
            "${{ matrix.image }}" "/app/$datei"
          trap 'echo "--- Ausgabe der Programmdatei"; docker logs pruefling; docker rm -f pruefling > /dev/null' EXIT
          docker exec pruefling sh -c 'ldd --version 2>&1 | head -1' || true
          node scripts/smoke-test.mjs --url http://127.0.0.1:3001 --mode binary

  # Die Installationspakete (#25) werden installiert wie bei einem Nutzer, danach startet
  # Mietfuchs als ganz normaler Benutzer. In /usr/bin darf der nicht schreiben, seine Daten
  # gehören deshalb nach ~/.local/share/mietfuchs (server/src/store.ts). Geprüft wird mit
  # demselben Skript wie jede Programmdatei, und zwar auf je einer Distribution pro Format.
  # Welche Pakete dieser Lauf prüft, entscheidet der Job „Prüfumfang festlegen“ oben.
  pakete:
    name: Paket auf ${{ matrix.name }}
    needs: [umfang, signieren]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.umfang.outputs.pakete) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Das Prüfskript erwartet die Version aus server/package.json. Beim Tag steht in der
      # Programmdatei die aus dem Tag (siehe „Programmdateien bauen“), also auch hier.
      - name: Version aus dem Tag übernehmen
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-binaries
          path: pakete

      - name: Installieren, als Benutzer starten und prüfen
        shell: bash
        run: |
          # --network host: Die Programmdatei erreicht das nachgebaute Ollama des Prüfskripts
          # unter 127.0.0.1, und das Skript erreicht Mietfuchs ebenso.
          docker run -d --name pruefling --network host -v "$PWD/pakete:/pkg:ro" \
            "${{ matrix.image }}" sleep 1800
          trap 'echo "--- Ausgabe von Mietfuchs"; docker exec pruefling cat /tmp/server.log 2>/dev/null; docker rm -f pruefling > /dev/null' EXIT
          docker exec pruefling sh -c '${{ matrix.install }} /pkg/${{ matrix.muster }}'
          docker exec pruefling useradd --create-home pruefer
          # Den Benutzer wechselt Docker selbst: `su` bringen nicht alle Abbilder mit (AlmaLinux
          # 10 etwa nicht). HOME muss dabei ausdrücklich mit, sonst läge der Datenordner falsch.
          docker exec -d --user pruefer \
            -e HOME=/home/pruefer -e CI=true -e NKA_PORT=3001 \
            -e NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test \
            pruefling sh -c 'mietfuchs > /tmp/server.log 2>&1'
          # Betriebsart „package“: Aus einem Paket installiert, erklärt der Update-Hinweis das
          # Aktualisieren über die Paketverwaltung statt über das Austauschen der Datei.
          node scripts/smoke-test.mjs --url http://127.0.0.1:3001 --mode package
          echo '--- Datenordner des Benutzers'
          # Aus einem Paket installiert, kann der Server nicht neben sich schreiben, die Daten
          # müssen also im Heimatordner liegen (systemLocation in paths.ts). Geprüft wird die
          # Datenbank, denn sie ist seit dem Umstellen der Routen die Ablage; eine db.json legt
          # Mietfuchs gar nicht mehr an.
          docker exec pruefling ls -l /home/pruefer/.local/share/mietfuchs/mietfuchs.sqlite
          # Einmal genügt: Der Startmenü-Eintrag ist in jedem Paket derselbe, und nur Debian
          # und Verwandte bringen das Prüfprogramm dafür mit.
          if [ '${{ matrix.startmenue }}' = 'ja' ]; then
            docker exec pruefling sh -c 'apt-get -qq update && apt-get -qq install -y desktop-file-utils'
            docker exec pruefling desktop-file-validate /usr/share/applications/mietfuchs.desktop
            docker exec pruefling sh -c 'ls /usr/share/icons/hicolor/*/apps/mietfuchs.*'
          fi

          # Zweiter Klick im Startmenü, während Mietfuchs schon läuft: Er darf nicht mit einem
          # Fehler enden, sondern soll nur die Oberfläche öffnen (#45).
          echo '--- Zweiter Start auf demselben Port'
          docker exec --user pruefer             -e HOME=/home/pruefer -e CI=true -e NKA_PORT=3001             -e NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test             pruefling mietfuchs

          # Beenden aus der Oberfläche. Ohne Konsolenfenster ist das der einzige Weg, deshalb
          # wird er auf jeder Programmdatei geprüft.
          echo '--- Beenden über die Oberfläche'
          node -e 'const url = "http://127.0.0.1:3001";
            const gone = async () => { try { await fetch(url + "/healthz"); return false } catch { return true } };
            (async () => {
              const antwort = await (await fetch(url + "/api/quit", { method: "POST" })).json();
              if (!antwort.ok) throw new Error("Unerwartete Antwort: " + JSON.stringify(antwort));
              for (let i = 0; i < 50; i++) { if (await gone()) return console.log("Mietfuchs hat sich beendet"); await new Promise((r) => setTimeout(r, 200)) }
              throw new Error("Mietfuchs läuft nach dem Beenden weiter");
            })()'

  # Das eigene Programmfenster (#517): unter Windows ein Installer für x64 und ARM64 zusammen
  # (NSIS, für den Benutzer, ohne Adminrechte), auf dem Mac je ein .dmg, ad hoc signiert
  # (scripts/package-desktop.mjs). Eine Programmdatei des Servers ist nicht darin: Er läuft als ein
  # Bündel (server.mjs, mit rolldown aus Vite) mit Electrons eigenem Node als utilityProcess, in der
  # app.asar unter mietfuchs/ samt dem Frontend (eine Datei), das dieser Job selbst baut. Daneben die entpackten
  # Windows-Ordner, aus denen „Store-Paket bauen und prüfen“ das Store-Paket packt.
  #
  # Bis PR 2 von #517 stand das in einem eigenen Workflow (desktop.yml). Er ist hier aufgegangen:
  # Ein PR durch diesen Workflow dauert so lange wie damals der eigene Lauf (rund sechs Minuten),
  # ein schneller Weg fürs Fenster allein brächte also nichts. Eine Änderung am Fenster ändert
  # jetzt auch das Store-Paket, und das prüft nur dieser Workflow. Und so steht Bau und Prüfung an
  # einer Stelle, statt doppelt oder über einen aufgerufenen Workflow mit zwei Betriebsarten.
  #
  # Kein Prüfumfang: Das Fenster wird in jedem Lauf gebaut und auf allen vier Systemen geprüft,
  # wie die Programmdateien im Job „Prüfen auf …“.
  fenster-bauen:
    name: Programmfenster bauen (${{ matrix.name }})
    # Hängt an keiner Programmdatei: Der Server läuft im Fenster als Bündel mit Electrons eigenem Node
    # (utilityProcess), package-desktop.mjs bündelt ihn samt Migrationen und legt das Frontend als eine Datei daneben. So beginnt
    # der Bau sofort und wartet nicht auf Bun und das Signieren.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, runner: windows-2025, ziel: win }
          - { name: macOS, runner: macos-15, ziel: mac }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            client/package-lock.json
            server/package-lock.json
      # Installer und .dmg tragen die Version im Namen, beim Tag die aus dem Tag (set-version.mjs
      # zieht desktop/package.json mit)
      - name: Version aus dem Tag übernehmen
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs
      # Das Frontend, das der Server im Fenster aus client/dist ausliefert; client/node_modules bringt
      # mit Vite auch den Bündler (rolldown) für den Server mit
      - name: Frontend bauen
        run: |
          npm --prefix client ci
          npm --prefix client run build
      # Was ins Bündel des Servers kommt; die Entwicklungswerkzeuge braucht es dafür nicht
      - run: npm --prefix server ci --omit=dev --ignore-scripts
      - run: npm --prefix desktop ci
      # Die Tests des Fensters auch auf dem System, für das es gebaut wird (Pfade, Ports)
      - run: npm --prefix desktop test
      - name: Programmfenster bauen
        run: node scripts/package-desktop.mjs ${{ matrix.ziel }}
      - uses: actions/upload-artifact@v7
        with:
          name: fenster-${{ matrix.ziel }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
          if-no-files-found: error
      - name: Größen in die Zusammenfassung
        shell: bash
        run: |
          {
            echo "## Programmfenster gebaut (${{ matrix.name }})"
            echo '```'
            ls -l dist-desktop/*.exe dist-desktop/*.dmg 2>/dev/null || true
            echo "Server-Ordner: $(du -sm dist-desktop-server | cut -f1) MB"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Die entpackten Ordner, die electron-builder für den Installer anlegt, sind der Inhalt des
      # Store-Pakets (scripts/package-msix.mjs): dieselben Dateien wie im Installer.
      - name: Entpackte Ordner hochladen (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: fenster-win-ordner
          path: |
            dist-desktop/win-unpacked
            dist-desktop/win-arm64-unpacked
          if-no-files-found: error
          retention-days: 7

  # Installieren wie ein Nutzer und von außen prüfen (scripts/desktop-check.mjs: Start, smoke-test,
  # zweiter Start, Beenden aus der Oberfläche, Absturz des Fensters). Größen, Startzeit und Speicher
  # stehen in der Zusammenfassung.
  fenster-pruefen:
    name: Programmfenster prüfen auf ${{ matrix.name }}
    needs: fenster-bauen
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-2025, ziel: win }
          - { name: Windows ARM64, runner: windows-11-arm, ziel: win }
          - { name: macOS Apple Silicon, runner: macos-15, ziel: mac, dmg: apple-silicon }
          - { name: macOS Intel, runner: macos-15-intel, ziel: mac, dmg: intel }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # smoke-test.mjs erwartet die Version aus server/package.json, beim Tag die aus dem Tag
      - name: Version aus dem Tag übernehmen
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs
      - uses: actions/download-artifact@v8
        with:
          name: fenster-${{ matrix.ziel }}
          path: paket
      - name: Installieren wie ein Nutzer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem paket\Mietfuchs-Setup-*.exe | Select-Object -First 1
          "Installer: $($setup.Name), $([math]::Round($setup.Length / 1MB, 1)) MB" | Tee-Object -Append groessen.txt
          # Der Echtzeitschutz von Windows Defender prüft beim Installieren jede neue Datei einzeln und ist auf
          # echten Rechnern an. Auf dem Runner einschalten, wenn er aus ist, und den Stand belegen. Nur messen:
          # Ausnahmen werden keine eingetragen.
          try {
            $vorher = (Get-MpComputerStatus -ErrorAction Stop).RealTimeProtectionEnabled
            Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop
            $mp = Get-MpComputerStatus -ErrorAction Stop
            "Echtzeitschutz: vorher $vorher, zur Installation $($mp.RealTimeProtectionEnabled) (Antivirus $($mp.AntivirusEnabled), Modus $($mp.AMRunningMode))" | Tee-Object -Append groessen.txt
          } catch {
            "Echtzeitschutz nicht einschaltbar: $($_.Exception.Message)" | Tee-Object -Append groessen.txt
          }
          # Still installieren, für den Benutzer, ohne Adminrechte; die Dauer kommt in die Zusammenfassung
          $dauer = Measure-Command { Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait }
          "Installation: $([math]::Round($dauer.TotalSeconds, 1)) s" | Tee-Object -Append groessen.txt
          # Der Ordner heißt wie das Paket (desktop/package.json, `name`)
          $dir = "$env:LOCALAPPDATA\Programs\mietfuchs"
          $exe = Join-Path $dir 'Mietfuchs.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 | Out-Host; throw "$exe nach der Installation nicht gefunden" }
          "Installiert: $dir, $([math]::Round((Get-ChildItem $dir -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB" | Tee-Object -Append groessen.txt
          # Die Zahl der Dateien bestimmt, wie lange der Echtzeitschutz beim Installieren prüft
          $resources = Join-Path $dir 'resources'
          "Dateien: $((Get-ChildItem $dir -Recurse -File).Count) installiert; unter resources: $((Get-ChildItem $resources -Recurse -File | ForEach-Object { "$($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }) -join ', ')" | Tee-Object -Append groessen.txt
          # Der Server liegt in der app.asar (desktop/package.json, `files`), keine Skriptdatei offen im Ordner
          if (Test-Path (Join-Path $resources 'mietfuchs')) { throw 'resources\mietfuchs liegt offen im Installationsordner' }
          node -e "import('./scripts/package-desktop.mjs').then((m) => m.checkServerArchive(process.argv[1]))" (Join-Path $resources 'app.asar')
          if ($LASTEXITCODE -ne 0) { throw 'Der Server fehlt in der app.asar' }
          # Startet der Installer das Programm danach, belegte es den Port der Prüfung: bis zu 20
          # Sekunden darauf warten und es dann beenden; der Server ist ein Prozess des Fensters (Mietfuchs.exe)
          for ($i = 0; $i -lt 20; $i++) {
            if (Get-Process Mietfuchs -ErrorAction SilentlyContinue) { break }
            Start-Sleep -Seconds 1
          }
          Get-Process Mietfuchs -ErrorAction SilentlyContinue | Stop-Process -Force
          "APP=$exe" >> $env:GITHUB_ENV
      - name: Installieren wie ein Nutzer (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls paket/Mietfuchs-*-${{ matrix.dmg }}.dmg)
          echo "Abbild: $(basename "$dmg"), $(du -m "$dmg" | cut -f1) MB" | tee -a groessen.txt
          hdiutil attach "$dmg" -nobrowse -mountpoint "$RUNNER_TEMP/abbild"
          mkdir -p "$RUNNER_TEMP/Programme"
          start=$(node -p 'Date.now()')
          cp -R "$RUNNER_TEMP/abbild/Mietfuchs.app" "$RUNNER_TEMP/Programme/"
          echo "Installation (Kopieren aus dem Abbild): $(node -p "((Date.now() - $start) / 1000).toFixed(1)") s" | tee -a groessen.txt
          hdiutil detach "$RUNNER_TEMP/abbild"
          app="$RUNNER_TEMP/Programme/Mietfuchs.app"
          echo "Installiert: $(du -sm "$app" | cut -f1) MB" | tee -a groessen.txt
          echo "Dateien: $(find "$app" -type f | wc -l | tr -d ' ') installiert; app.asar $(du -m "$app/Contents/Resources/app.asar" | cut -f1) MB" | tee -a groessen.txt
          # Ad hoc signiert; ohne gültige Signatur startet auf Apple Silicon nichts. Der Server liegt als
          # Bündel in der app.asar, die von der Signatur der App und der Prüfung ihrer Integrität erfasst ist.
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier'
          test ! -e "$app/Contents/Resources/mietfuchs"
          node -e "import('./scripts/package-desktop.mjs').then((m) => m.checkServerArchive(process.argv[1]))" "$app/Contents/Resources/app.asar"
          echo "APP=$app/Contents/MacOS/Mietfuchs" >> "$GITHUB_ENV"
      - name: Starten und prüfen
        run: node scripts/desktop-check.mjs --app "${{ env.APP }}" --out fenster-pruefung
      - name: Bericht in die Zusammenfassung
        if: always()
        shell: bash
        run: |
          {
            echo "## Programmfenster auf ${{ matrix.name }}"
            echo '```'
            cat groessen.txt 2>/dev/null || true
            cat fenster-pruefung/bericht.json 2>/dev/null || echo 'kein Bericht'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fenster-pruefung-${{ matrix.runner }}
          path: fenster-pruefung
          retention-days: 14

  # Eine KI-Auswertung auf dem Prozessor kann länger als fünf Minuten dauern. fetch unter Node und
  # Firefox brechen nach 300 Sekunden ohne Antwort-Header ab (#17). Das nachgebaute Ollama
  # schweigt hier 320 Sekunden; die Auswertung muss trotzdem ankommen. Geprüft wird der Start aus
  # dem Quellcode, also der Weg von npm und Docker-Image; die Programmdateien prüft der Job
  # „Prüfen auf …“ oben unter derselben Bedingung, dort mit Bun statt Node.
  #
  # Der Job stand bis #52 in ci.yml und lief bei jedem PR. Er kostete dort knapp sieben von neun
  # Minuten Wartezeit, hängt aber an der Laufzeit und der HTTP-Schicht statt am Fachcode und
  # ändert sich damit erst mit einer neuen Node- oder Bun-Version. Deshalb läuft er jetzt nur
  # noch beim Tag, beim wöchentlichen Zeitplan, beim Start von Hand und an einem PR mit dem
  # Label „full-check“, also genau dann, wenn auch die volle Matrix läuft.
  slow-ai-answer:
    name: Lange KI-Antwort (Node)
    needs: umfang
    if: needs.umfang.outputs.vollstaendig == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm install
      - run: npm run build
      - name: Auswertung mit 320 Sekunden Wartezeit
        run: |
          NKA_DATA_DIR="$RUNNER_TEMP/daten" NKA_PORT=3001 NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test \
            node server/src/index.ts > server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; echo "--- Ausgabe des Servers"; cat server.log' EXIT
          node scripts/smoke-test.mjs --url http://127.0.0.1:3001 --mode npm --slow-ai 320

  # Der Browserlauf (#340, Schritt 11 von #346): jede Seite der Navigation in Chromium, Firefox und
  # WebKit (Safari), am Rechner und am Handy, hell und dunkel, mit axe-core und den Bedienproben
  # (scripts/browser-check.mjs). Er läuft im vollen Umfang wie die lange KI-Antwort, also beim Tag,
  # im wöchentlichen Lauf, von Hand und mit dem Label „full-check“, und nicht an jedem PR. Je Engine
  # ein Job, damit ein Befund in einer Engine die anderen nicht verdeckt; die Browser samt
  # Systembibliotheken holt `playwright install --with-deps` in der Fassung aus package-lock.json.
  # Fotos und Bericht hängen als Artefakt am Lauf, auch wenn er rot ist.
  browserlauf:
    name: Browserlauf (${{ matrix.engine }})
    needs: umfang
    if: needs.umfang.outputs.vollstaendig == 'true'
    runs-on: ubuntu-24.04
    # Lokal drei bis vier Minuten je Engine; ein hängender Browser hält das Anhängen sonst sechs Stunden auf
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm install
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Seiten und Bedienproben prüfen
        run: npm run browser-check -- --engines ${{ matrix.engine }} --out "$RUNNER_TEMP/browserlauf"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browserlauf-${{ matrix.engine }}
          path: ${{ runner.temp }}/browserlauf
          if-no-files-found: error
          # Rund 60 ganzseitige Fotos je Engine und Woche; zum Nachsehen reichen zwei Wochen
          retention-days: 14

  # Die Ausnahmen für axe (scripts/browser-check-axe.json) dürfen nur sinken. Ob eine sinken kann,
  # weiß erst, wer alle drei Engines gesehen hat; deshalb ein eigener Job über die Artefakte.
  browserlauf-ausnahmen:
    name: Browserlauf (axe-Ausnahmen)
    needs: browserlauf
    # Auch nach einem roten Browserlauf, denn seine Artefakte liegen trotzdem vor; nicht, wenn er gar
    # nicht lief (Pull Request ohne „full-check“)
    if: ${{ !cancelled() && needs.browserlauf.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: browserlauf-*
          path: browserlauf
      - run: node scripts/browser-check.mjs --merge browserlauf

  # Nur bei einem echten Tag-Push, und nur wenn alle Prüfungen bestanden sind. Beim Tag läuft
  # auch die lange KI-Antwort, sie gehört deshalb in die Liste, ebenso der Browserlauf und das
  # Programmfenster: Was hier nicht grün ist, wird nicht ans Release gehängt.
  #
  # Zum Programmfenster (Installer und .dmg) bleiben die Programmdateien (.exe, macOS-Zip) vorerst
  # am Release: Den Umzug der Daten aus dem Ordner neben der Programmdatei in den Benutzerordner
  # bringt erst PR 3 von #517, bis dahin fänden Nutzer ihre Daten im Fenster nicht.
  veroeffentlichen:
    name: Ans Release anhängen
    needs: [pruefen, distributionen, pakete, slow-ai-answer, browserlauf, browserlauf-ausnahmen, fenster-pruefen]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-binaries
          path: dist-bin
      # Installer und .dmg des Programmfensters (#517)
      - uses: actions/download-artifact@v8
        with:
          name: fenster-win
          path: dist-desktop
      - uses: actions/download-artifact@v8
        with:
          name: fenster-mac
          path: dist-desktop
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-bin/*.zip
            dist-bin/*.tar.gz
            dist-bin/*.exe
            dist-bin/*.deb
            dist-bin/*.rpm
            dist-bin/*.pkg.tar.zst
            dist-desktop/Mietfuchs-Setup-*.exe
            dist-desktop/Mietfuchs-*-apple-silicon.dmg
            dist-desktop/Mietfuchs-*-intel.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Ein Tag mit Bindestrich ist nach SemVer eine Vorabversion (v0.8.0-rc.1), und genau so
          # wird das Release dann auch gekennzeichnet.
          #
          # **Das ist eine Sicherung, kein Verfahren.** `prerelease` steht in der action.yml von
          # softprops ohne Automatik auf `false`; ohne diese Zeile erschiene ein
          # Release-Kandidat als vollwertiges Release. Dann lieferte ihn `releases/latest` aus,
          # und jeder Nutzer mit eingeschalteter Update-Prüfung bekäme ihn angeboten (siehe
          # update.ts, das Vorabversionen ausdrücklich überspringt). Solange niemand einen
          # solchen Tag setzt, ändert die Zeile nichts; setzt doch einmal jemand einen, verhindert
          # sie den stillen Fehlgriff.
          #
          # Das Docker-Image braucht nichts dergleichen: `docker/metadata-action` mit
          # `latest=auto` vergibt `latest` bei einer Vorabversion von sich aus nicht.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Das Paket für den Microsoft Store (#500): aus dem Programmfenster (#517) je Architektur ein
  # .msix, zusammen ein .msixbundle (scripts/package-msix.mjs). Hinein kommt der entpackte Ordner
  # des Fensters aus „Programmfenster bauen (Windows)“, darin der Server als Bündel in der
  # resources\app.asar, den das Fenster als utilityProcess startet. Unsigniert, das übernimmt der Store. Geprüft wird eine
  # Kopie, die ein Wegwerf-Zertifikat mit demselben Herausgeber signiert: installieren, starten,
  # Prüfskript, Beenden über die Oberfläche, deinstallieren. Dabei zählt vor allem der Datenordner:
  # Er muss im echten Benutzerordner liegen und die Deinstallation überstehen. Unter AppData hätte
  # Windows ihn ins Paket umgelenkt und mit ihm gelöscht.
  store-paket:
    name: Store-Paket bauen und prüfen
    needs: fenster-bauen
    runs-on: windows-2025
    env:
      # Der Port des Fensters (DEFAULT_PORT in desktop/src/server.js); die Programmdatei ohne
      # Fenster lauschte auf 3001
      FENSTER_PORT: '17517'
      NKA_UPDATE_URL: http://127.0.0.1:9/kein-internet-im-test
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Die Paketversion kommt aus server/package.json, beim Tag also aus dem Tag.
      - name: Version aus dem Tag übernehmen
        if: github.ref_type == 'tag'
        run: node scripts/set-version.mjs
      - uses: actions/download-artifact@v8
        with:
          name: fenster-win-ordner
          path: dist-desktop

      - name: Paket bauen
        run: node scripts/package-msix.mjs

      - name: Probehalber signieren, installieren und prüfen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem dist-bin\msix\*.msixbundle | Select-Object -First 1
          "Store-Paket: $($bundle.Name), $([math]::Round($bundle.Length / 1MB, 1)) MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $probe = Join-Path $env:RUNNER_TEMP $bundle.Name
          Copy-Item $bundle.FullName $probe

          # Wegwerf-Zertifikat mit dem Herausgeber aus dem Manifest, nur für diesen Runner
          $publisher = ([xml](Get-Content packaging\msix\AppxManifest.xml)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'Mietfuchs Probe' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $password = ConvertTo-SecureString -String 'probe' -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'probe.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'probe.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          & $sdk.FullName sign /fd SHA256 /f $pfx /p probe $probe
          if ($LASTEXITCODE -ne 0) { throw 'Signieren der Probe fehlgeschlagen' }

          $data = Join-Path $env:USERPROFILE 'Mietfuchs'
          if (Test-Path $data) { throw "Der Datenordner $data existiert schon vor dem Start" }
          $dauer = Measure-Command { Add-AppxPackage -Path $probe }
          "Store-Paket installiert in $([math]::Round($dauer.TotalSeconds, 1)) s" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $app = Get-AppxPackage -Name speedone.Mietfuchs
          Write-Host "Installiert: $($app.PackageFullName) in $($app.InstallLocation)"
          $url = "http://127.0.0.1:$env:FENSTER_PORT"

          try {
            # Über den Befehlsalias starten: Nur so erbt das Fenster CI und NKA_UPDATE_URL und reicht
            # sie an den Server weiter (serverEnv in desktop/src/server.js). Beide laufen trotzdem als
            # Store-App, im Paket und mit dessen Umlenkungen.
            $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\mietfuchs.exe'
            Start-Process -FilePath $alias
            # Betriebsart store: Das Fenster sagt es dem Server (NKA_STORE aus process.windowsStore), zur
            # Sicherheit erkennt er auch den Paketordner; im Protokoll steht, was das Fenster sah (Store ja/nein)
            node scripts/smoke-test.mjs --url $url --mode store
            if ($LASTEXITCODE -ne 0) { throw 'Prüfung des Store-Pakets fehlgeschlagen' }

            # Fenster und Server laufen aus dem Paket: beide sind Mietfuchs.exe oben im Paket, der Server als
            # utilityProcess mit dem Bündel in der resources\app.asar
            $fenster = Join-Path $app.InstallLocation 'Mietfuchs.exe'
            $laufend = Get-CimInstance Win32_Process -Filter "Name = 'Mietfuchs.exe'" | Select-Object ProcessId, ExecutablePath, CommandLine
            $laufend | Format-Table ProcessId, ExecutablePath -AutoSize | Out-Host
            $ausDemPaket = $laufend | Where-Object { $_.ExecutablePath -eq $fenster }
            if (-not ($ausDemPaket | Where-Object { $_.CommandLine -notmatch '--type=' })) { throw "Das Fenster $fenster läuft nicht" }
            if (-not ($ausDemPaket | Where-Object { $_.CommandLine -match 'node\.mojom\.NodeService' })) { throw "Der Server läuft nicht als utilityProcess von $fenster" }

            # Beenden aus der Oberfläche: Der Server endet, und das Fenster geht mit ihm
            $antwort = Invoke-RestMethod -Method Post -Uri "$url/api/quit"
            if (-not $antwort.ok) { throw "Unerwartete Antwort auf /api/quit: $($antwort | ConvertTo-Json -Compress)" }
            $beendet = $false
            for ($i = 0; $i -lt 60; $i++) {
              if (-not (Get-Process Mietfuchs -ErrorAction SilentlyContinue)) { $beendet = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $beendet) { throw 'Fenster oder Server laufen nach dem Beenden aus der Oberfläche weiter' }
            Write-Host 'Fenster und Server haben sich beendet'
          } finally {
            # Das Protokoll des Servers schreibt das Fenster in seinen eigenen Ordner, im Paket nach
            # LocalCache umgelenkt
            Get-Process Mietfuchs -ErrorAction SilentlyContinue | Stop-Process -Force
            $protokoll = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Packages') -Recurse -Filter server.log -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*speedone.Mietfuchs_*mietfuchs-fenster*' }
            foreach ($datei in $protokoll) { Write-Host "--- $($datei.FullName)"; Get-Content $datei.FullName }
          }

          $db = Join-Path $data 'mietfuchs.sqlite'
          if (-not (Test-Path $db)) {
            $umgelenkt = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Packages') -Recurse -Filter mietfuchs.sqlite -ErrorAction SilentlyContinue
            throw "Keine Datenbank unter $db. Umgelenkt nach: $($umgelenkt.FullName)"
          }
          Remove-AppxPackage -Package $app.PackageFullName
          if (-not (Test-Path $db)) { throw 'Die Deinstallation hat die Daten gelöscht' }
          Write-Host "Daten nach der Deinstallation erhalten: $db"

      - uses: actions/upload-artifact@v7
        with:
          name: mietfuchs-store
          path: dist-bin/msix/*.msixbundle
          if-no-files-found: error

  # Reicht das geprüfte Paket beim Tag im Microsoft Store ein (#500), siehe store.yml. Nie bei einer
  # Vorabversion (Bindestrich im Tag). Erst nach dem Anhängen ans Release, damit der Store nichts
  # bekommt, was es bei GitHub nicht gibt.
  #
  # Schalter: die Repository-Variable MSSTORE_EINREICHEN = an (Settings → Variables). Ohne sie
  # läuft nichts, denn die Store-CLI kann nur eine App aktualisieren, die schon einmal von Hand
  # eingereicht und veröffentlicht ist.
  store-einreichen:
    name: Microsoft Store
    needs: [store-paket, veroeffentlichen]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && vars.MSSTORE_EINREICHEN == 'an'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/store.yml
    secrets:
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
