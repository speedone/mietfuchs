name: Release-Binaries

# Baut die eigenständigen Mietfuchs-Programmdateien, prüft jede auf einem echten Rechner ihres
# Systems und hängt sie erst dann ans GitHub-Release (#22). Läuft bei einem Tag wie v0.1.2, bei
# PRs, die Server, Oberfläche oder Build ändern, und von Hand.
#
# Bun kompiliert alle Ziele von einem einzigen Linux-Runner aus. Ob eine Datei auf ihrem
# System wirklich startet, zeigt aber erst ein Rechner mit diesem System: Genau so ein Fehler
# (gescannte PDFs, #21) fiel sonst erst bei Nutzern auf.
#
# Was ein Pull Request auslässt, steht hier beisammen (#52): die volle Liste der Distributionen
# und Pakete, die lange KI-Antwort unter Node und das lange Warten bei den Programmdateien. Ein
# PR prüft davon eine Auswahl, der Tag alles, und nichts geht ans Release, was nicht geprüft
# ist. Wer die volle Breite schon vor dem Merge will, hängt dem PR das Label „full-check“
# an; das startet diesen Workflow neu, dann mit allem. Dazu läuft einmal die Woche derselbe
# volle Umfang von selbst, siehe „schedule“ unten.
on:
  push:
    tags:
      - 'v*'

  # Das Netz für alles, was ein Pull Request nicht mehr prüft (#52), vor allem für die lange
  # KI-Antwort: Sie prüft, dass eine Antwort noch ankommt, wenn der Anbieter länger als fünf
  # Minuten schweigt, und das hängt bei der Programmdatei an Bun. Bun wird bewusst mit `latest`
  # gebaut, kann sich also jeden Tag ändern, und ohne diesen Lauf fiele eine kaputte Fassung
  # erst beim Tag auf, wenn das Release schon halb gebaut ist. Genau das schließt #52 aus.
  # Wöchentlich reicht, weil der Lauf nichts kostet, was ein Entwickler abwartet.
  #
  # Mittwochs 4:23 UTC, also bewusst nicht zur vollen Stunde: Dorthin legen alle ihre Zeitpläne,
  # GitHub verzögert sie dann oder lässt sie ausfallen. Der Lauf nimmt den Standardzweig.
  # Wer ihn löschen will, gibt dieses Netz auf. Achtung: GitHub schaltet Zeitpläne nach 60 Tagen
  # ohne Bewegung im Repo ab, nach einer langen Pause also nachsehen, ob er noch läuft.
  schedule:
    - cron: '23 4 * * 3'
  pull_request:
    # Ohne „types“ gälten nur opened, synchronize und reopened. „labeled“ kommt dazu, damit das
    # Label „full-check“ einen neuen Lauf auslöst. Die Pfadliste gilt auch dafür: An einem
    # PR, der nichts davon anfasst, läuft dieser Workflow gar nicht, und das Label bewirkt
    # nichts. Das ist gewollt, denn dann gibt es auch nichts zu prüfen.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - server/**
      - client/**
      - scripts/**
      - packaging/**
      - package.json
      - package-lock.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Legt fest, wie breit die Container-Prüfungen laufen, und gibt beide Matrizen als JSON weiter.
  # Ein eigener Job dafür, weil die Matrix eines Jobs nur aus einem Ausdruck kommen kann und der
  # keine Listen aus der Umgebung kennt (in „strategy“ gibt es github, needs, vars und inputs).
  #
  # Die Auswahl für den Pull Request, und warum gerade sie:
  #   centos:7 hat genau glibc 2.17, die Untergrenze der Linux-Programmdatei. Was an der
  #     C-Bibliothek bricht, bricht zuerst hier.
  #   ubuntu:26.04 ist das andere Ende, also die neueste glibc und die neuesten Werkzeuge.
  #     Zusammen spannen die beiden den Bereich auf, in dem alle übrigen Distributionen liegen.
  #   Ubuntu 24.04 mit dem .deb und Fedora mit dem .rpm prüfen die beiden Paketformate, die nFPM
  #     aus derselben Vorschrift baut, dazu den Datenordner des Benutzers, den zweiten Start auf
  #     belegtem Port und das Beenden aus der Oberfläche. Das .deb prüft zusätzlich den
  #     Startmenü-Eintrag, denn nur Debian und Verwandte bringen desktop-file-validate mit.
  #
  # Was ein Pull Request damit nicht sieht und erst der Zeitplan oder der Tag abdeckt: alle
  # Distributionen zwischen den beiden Enden (Debian 11 bis 13, Ubuntu 20.04 und 22.04,
  # AlmaLinux, Rocky, openSUSE und Arch), jede Container-Prüfung auf ARM64, das Arch-Paket sowie
  # das .rpm auf dem älteren openSUSE Leap und auf ARM64. Ein Fehler, der nur eine dieser
  # Umgebungen trifft, fällt also spätestens eine Woche später auf, immer aber vor dem
  # Anhängen ans Release. Die
  # ARM64-Programmdatei selbst prüft weiterhin jeder PR, nämlich im Job „Prüfen auf Linux
  # ARM64“ auf einem ARM-Runner.
  umfang:
    name: Prüfumfang festlegen
    runs-on: ubuntu-24.04
    outputs:
      vollstaendig: ${{ steps.waehlen.outputs.vollstaendig }}
      distributionen: ${{ steps.waehlen.outputs.distributionen }}
      pakete: ${{ steps.waehlen.outputs.pakete }}
    steps:
      - id: waehlen
        env:
          # Vollständig geprüft wird alles außer einem Pull Request ohne das Label
          # „full-check“. Also der Tag, der wöchentliche Zeitplan und der Start von Hand.
          #
          # Bewusst als Ausnahme geschrieben und nicht als Liste der vollen Fälle: Eine Liste
          # vergisst man beim nächsten Auslöser. Genau das wäre hier fast passiert, der
          # Zeitplan hätte still die kleine Auswahl gefahren. So läuft ein neuer Auslöser
          # vollständig, also im Zweifel zu viel statt zu wenig. Der push-Auslöser oben hört nur
          # auf Tags `v*`, ein Push ohne Tag kommt hier gar nicht an. Auf Ereignissen ohne Pull
          # Request ist die Labelliste leer, das ergibt falsch und keinen Fehler.
          VOLLSTAENDIG: >-
            ${{ github.event_name != 'pull_request'
            || contains(github.event.pull_request.labels.*.name, 'full-check') }}
        run: |
          # Jede Distribution unterscheidet sich in der C-Bibliothek und in den mitgelieferten
          # Werkzeugen, deshalb prüft jede die Programmdatei erneut.
          alle_distributionen='[
            {"arch": "x64", "image": "centos:7"},
            {"arch": "x64", "image": "debian:11"},
            {"arch": "x64", "image": "debian:12"},
            {"arch": "x64", "image": "debian:13"},
            {"arch": "x64", "image": "ubuntu:20.04"},
            {"arch": "x64", "image": "ubuntu:22.04"},
            {"arch": "x64", "image": "ubuntu:24.04"},
            {"arch": "x64", "image": "ubuntu:26.04"},
            {"arch": "x64", "image": "fedora:latest"},
            {"arch": "x64", "image": "almalinux:8"},
            {"arch": "x64", "image": "almalinux:10"},
            {"arch": "x64", "image": "rockylinux:9"},
            {"arch": "x64", "image": "opensuse/leap:15.6"},
            {"arch": "x64", "image": "opensuse/tumbleweed"},
            {"arch": "x64", "image": "archlinux:latest"},
            {"arch": "arm64", "image": "centos:7"},
            {"arch": "arm64", "image": "debian:12"},
            {"arch": "arm64", "image": "ubuntu:20.04"},
            {"arch": "arm64", "image": "ubuntu:26.04"},
            {"arch": "arm64", "image": "fedora:latest"},
            {"arch": "arm64", "image": "almalinux:10"},
            {"arch": "arm64", "image": "opensuse/tumbleweed"}
          ]'
          auswahl_distributionen='[
            {"arch": "x64", "image": "centos:7"},
            {"arch": "x64", "image": "ubuntu:26.04"}
          ]'
          alle_pakete='[
            {"name": "Debian 12 (deb)", "image": "debian:12", "arch": "x64", "muster": "*_amd64.deb", "install": "dpkg -i"},
            {"name": "Ubuntu 24.04 (deb)", "image": "ubuntu:24.04", "arch": "x64", "muster": "*_amd64.deb", "install": "dpkg -i", "startmenue": "ja"},
            {"name": "Fedora (rpm)", "image": "fedora:latest", "arch": "x64", "muster": "*.x86_64.rpm", "install": "rpm -i"},
            {"name": "openSUSE Leap 15.6 (rpm)", "image": "opensuse/leap:15.6", "arch": "x64", "muster": "*.x86_64.rpm", "install": "rpm -i"},
            {"name": "Arch Linux", "image": "archlinux:latest", "arch": "x64", "muster": "*-x86_64.pkg.tar.zst", "install": "pacman -U --noconfirm"},
            {"name": "Debian 12 (deb, ARM64)", "image": "debian:12", "arch": "arm64", "muster": "*_arm64.deb", "install": "dpkg -i"},
            {"name": "AlmaLinux 10 (rpm, ARM64)", "image": "almalinux:10", "arch": "arm64", "muster": "*.aarch64.rpm", "install": "rpm -i"}
          ]'
          auswahl_pakete='[
            {"name": "Ubuntu 24.04 (deb)", "image": "ubuntu:24.04", "arch": "x64", "muster": "*_amd64.deb", "install": "dpkg -i", "startmenue": "ja"},
            {"name": "Fedora (rpm)", "image": "fedora:latest", "arch": "x64", "muster": "*.x86_64.rpm", "install": "rpm -i"}
          ]'

          if [ "$VOLLSTAENDIG" = 'true' ]; then
            distributionen=$alle_distributionen
            pakete=$alle_pakete
            beschreibung='volle Matrix (Tag, Zeitplan, Start von Hand oder Label „full-check“)'
          else
            distributionen=$auswahl_distributionen
            pakete=$auswahl_pakete
            beschreibung='Auswahl für den Pull Request (Label „full-check“ prüft alles)'
          fi

          # Sicherung gegen die stille Lücke: Eine Matrix ohne Einträge erzeugt keinen einzigen
          # Job, und GitHub meldet das nicht als Fehler, sondern überspringt den abhängigen Job.
          # Im Überblick sähe das fast aus wie bestanden, geprüft wäre aber nichts. Eine leere
          # Liste ist deshalb hier ein Fehler, bevor sie jemand als grün missversteht.
          anzahl_distributionen=$(printf '%s' "$distributionen" | jq 'length')
          anzahl_pakete=$(printf '%s' "$pakete" | jq 'length')
          if [ "$anzahl_distributionen" -lt 1 ] || [ "$anzahl_pakete" -lt 1 ]; then
            echo "Leere Liste: $anzahl_distributionen Distributionen, $anzahl_pakete Pakete." >&2
            echo "Eine leere Matrix prüft nichts und fiele niemandem auf. Abbruch." >&2
            exit 1
          fi

          # jq prüft dabei das JSON: Ist eine Liste kaputt, scheitert diese Zuweisung und damit
          # der Job, statt eine leere Matrix weiterzureichen.
          distributionen_json=$(printf '%s' "$distributionen" | jq -c '{include: .}')
          pakete_json=$(printf '%s' "$pakete" | jq -c '{include: .}')
          {
            echo "vollstaendig=$VOLLSTAENDIG"
            echo "distributionen=$distributionen_json"
            echo "pakete=$pakete_json"
          } >> "$GITHUB_OUTPUT"

          # In Bericht und Zusammenfassung nachlesbar, was dieser Lauf geprüft hat.
          echo "Umfang: $beschreibung"
          printf '%s' "$distributionen" | jq -r '.[] | "  Distribution: \(.image) (\(.arch))"'
          printf '%s' "$pakete" | jq -r '.[] | "  Paket: \(.name)"'
          {
            echo "### Prüfumfang"
            echo "$beschreibung"
            printf '%s' "$distributionen" | jq -r '.[] | "- Distribution: \(.image) (\(.arch))"'
            printf '%s' "$pakete" | jq -r '.[] | "- Paket: \(.name)"'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Programmdateien bauen
    # Runner bewusst anpinnen (nicht ubuntu-latest) — reproduzierbare Release-Builds.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Node für npm install (Server-/Client-Deps) und den vite-Build des Frontends.
      # Die Programmdateien selbst laufen mit Bun, nicht mit Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Bun für das Kompilieren. Bewusst die neueste Version: Bringt sie einen Fehler mit,
      # fällt er in den Prüfungen unten auf, bevor ein Release entsteht.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Root + server + client installieren (postinstall zieht die Unterpakete mit).
      - name: Abhängigkeiten installieren
        run: npm install

      # Frontend bauen, Embed-Modul erzeugen und alle Ziel-Binaries kompilieren.
      - name: Binaries bauen
        run: npm run package

      # Aus denselben Linux-Programmdateien die Installationspakete bauen (#25). nFPM kommt aus
      # seinem Container, der Runner braucht dafür nichts weiter als Docker.
      - name: Linux-Pakete bauen
        run: npm run package:linux

      # Nur Archive, Pakete + .exe verteilen, nicht die rohen macOS/Linux-Binaries: bei einem
      # rohen Download geht das Ausführungs-Bit verloren (#1) — die Archive konservieren es.
      - name: Binaries hochladen (Artefakt)
        uses: actions/upload-artifact@v7
        with:
          name: mietfuchs-ungesigniert
          path: |
            dist-bin/*.zip
            dist-bin/*.tar.gz
            dist-bin/*.exe
            dist-bin/*.deb
            dist-bin/*.rpm
            dist-bin/*.pkg.tar.zst
          if-no-files-found: error

  # Bun signiert macOS-Programmdateien beim Cross-Kompilieren unter Linux selbst (ad hoc). Diese
  # Signatur war schon mehrfach fehlerhaft, zuletzt bei der Intel-Datei trotz Bun 1.4.2
  # („invalid signature“, siehe oven-sh/bun#32159). Neuere macOS-Versionen beenden solche
  # Programme sofort. Deshalb auf einem echten Mac neu ad hoc signieren und prüfen.
  signieren:
    name: macOS-Dateien signieren
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-ungesigniert
          path: dist-bin
      - name: Neu signieren und neu verpacken
        working-directory: dist-bin
        run: |
          for archiv in mietfuchs-macos-*.zip; do
            programm="${archiv%.zip}"
            unzip -o "$archiv"
            codesign --force --sign - "$programm"
            codesign --verify --strict --verbose=2 "$programm"
            rm "$archiv"
            zip -j "$archiv" "$programm"   # zip -j erhält das Ausführungs-Bit
            rm "$programm"
          done
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: mietfuchs-binaries
          path: |
            dist-bin/*.zip
            dist-bin/*.tar.gz
            dist-bin/*.exe
            dist-bin/*.deb
            dist-bin/*.rpm
            dist-bin/*.pkg.tar.zst
          if-no-files-found: error

  # Jede Programmdatei auf einem Rechner ihres Systems starten und von außen prüfen
  # (scripts/smoke-test.mjs: Oberfläche, pdf.js-Dateien, KI-Auswertung, Belege, Abrechnung,
  # Backup). Geprüft werden die Archive, die auch Nutzer herunterladen.
  #
  # `slow_ai` lässt das nachgebaute Ollama länger als fünf Minuten schweigen: Bun bricht fetch
  # sonst nach 300 Sekunden ohne Antwort-Header ab, Mietfuchs schaltet das mit einer Bun-eigenen
  # Option ab (#17). Weil Bun mit `latest` baut, prüft das je Betriebssystem ein Lauf. Die
  # Zeitgeber hängen an der Ereignisschleife des Systems (epoll, kqueue, libuv), nicht an der
  # Architektur, deshalb reicht x64 bzw. Apple Silicon.
  #
  # Seit #52 hängt auch dieser lange Lauf am Prüfumfang, und das ist die Stelle, an der ein Pull
  # Request wirklich Wartezeit spart: Der Lauf wartet allein 320 Sekunden, und „Prüfen auf
  # Linux x64“ bestimmte damit mit 10,4 Minuten den längsten Weg eines PRs. Die Abwägung: Der
  # Test prüft, dass eine Antwort noch ankommt, wenn der Anbieter länger als fünf Minuten
  # schweigt. Das hängt an der Laufzeit und der HTTP-Schicht, bei der Programmdatei also an Bun,
  # und Bun wird bewusst mit `latest` gebaut, kann sich also jeden Tag ändern. Weg fällt die
  # Prüfung deshalb nicht, sie rückt ans Release: „Ans Release anhängen“ hängt von diesem Job
  # ab, ein Bun mit kaputtem Verhalten kommt also nicht ins Release. Wer es früher wissen will,
  # hängt dem Pull Request das Label „full-check“ an.
  pruefen:
    name: Prüfen auf ${{ matrix.name }}
    needs: [umfang, signieren]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, runner: ubuntu-24.04, datei: mietfuchs-linux.tar.gz, programm: mietfuchs-linux, slow_ai: --slow-ai 320 }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, datei: mietfuchs-linux-arm64.tar.gz, programm: mietfuchs-linux-arm64 }
          - { name: Windows x64, runner: windows-2025, datei: mietfuchs-win.exe, programm: mietfuchs-win.exe, slow_ai: --slow-ai 320 }
          - { name: Windows ARM64, runner: windows-11-arm, datei: mietfuchs-win-arm64.exe, programm: mietfuchs-win-arm64.exe }
          - { name: macOS Apple Silicon, runner: macos-15, datei: mietfuchs-macos-apple-silicon.zip, programm: mietfuchs-macos-apple-silicon, slow_ai: --slow-ai 320 }
          - { name: macOS Intel, runner: macos-15-intel, datei: mietfuchs-macos-intel.zip, programm: mietfuchs-macos-intel }
    env:
      NKA_PORT: '3001'
      # Kein Test darf das echte GitHub nach Updates fragen
      NKA_UPDATE_URL: http://127.0.0.1:9/kein-internet-im-test
      # Die Angabe für das Prüfskript: beim vollen Umfang „--slow-ai 320“ auf den drei Systemen,
      # die es in der Matrix tragen, sonst leer. Sie steht hier einmal, damit die beiden
      # Startschritte unten sie nur noch einsetzen müssen.
      SLOW_AI: ${{ needs.umfang.outputs.vollstaendig == 'true' && matrix.slow_ai || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-binaries
          path: bin

      - name: Entpacken wie ein Nutzer
        if: runner.os != 'Windows'
        shell: bash
        working-directory: bin
        run: |
          case "${{ matrix.datei }}" in
            *.zip) unzip -o "${{ matrix.datei }}" ;;
            *.tar.gz) tar -xzf "${{ matrix.datei }}" ;;
          esac
          ls -l

      # Die Signatur aus dem Schritt „signieren“ muss nach dem Ein- und Auspacken gültig sein.
      # Ist sie kaputt, beendet macOS das Programm sofort beim Start.
      - name: Signatur prüfen (macOS)
        if: runner.os == 'macOS'
        working-directory: bin
        run: |
          codesign --verify --strict --verbose=2 "${{ matrix.programm }}"
          file "${{ matrix.programm }}"

      - name: Starten und prüfen (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export NKA_DATA_DIR="$RUNNER_TEMP/daten"
          "./bin/${{ matrix.programm }}" > server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; echo "--- Ausgabe der Programmdatei"; cat server.log' EXIT
          node scripts/smoke-test.mjs --url "http://127.0.0.1:$NKA_PORT" --mode binary ${{ env.SLOW_AI }}

      - name: Starten und prüfen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NKA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'daten'
          $p = Start-Process -FilePath "bin\${{ matrix.programm }}" -PassThru -RedirectStandardOutput server.log -RedirectStandardError server.err
          try {
            node scripts/smoke-test.mjs --url "http://127.0.0.1:$env:NKA_PORT" --mode binary ${{ env.SLOW_AI }}
            if ($LASTEXITCODE -ne 0) { throw "Prüfung auf ${{ matrix.name }} fehlgeschlagen" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host '--- Ausgabe der Programmdatei'
            Get-Content server.log, server.err -ErrorAction SilentlyContinue
          }

  # Die Linux-Programmdatei braucht nur glibc 2.17 oder neuer. Derselbe Test läuft deshalb in
  # Containern gängiger Distributionen, von CentOS 7 (genau glibc 2.17) bis zu den neuesten.
  # Welche davon dieser Lauf prüft, entscheidet der Job „Prüfumfang festlegen“ oben.
  distributionen:
    name: Prüfen auf ${{ matrix.image }} (${{ matrix.arch }})
    needs: [umfang, signieren]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.umfang.outputs.distributionen) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-binaries
          path: bin
      - name: Im Container starten und prüfen
        shell: bash
        run: |
          datei=mietfuchs-linux${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          tar -xzf "bin/$datei.tar.gz" -C bin
          # --network host: Die Programmdatei erreicht das nachgebaute Ollama des Prüfskripts
          # unter 127.0.0.1, und das Skript erreicht die Programmdatei ebenso.
          docker run -d --name pruefling --network host -v "$PWD/bin:/app:ro" \
            -e NKA_DATA_DIR=/tmp/daten -e NKA_PORT=3001 -e CI=true \
            -e NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test \
            "${{ matrix.image }}" "/app/$datei"
          trap 'echo "--- Ausgabe der Programmdatei"; docker logs pruefling; docker rm -f pruefling > /dev/null' EXIT
          docker exec pruefling sh -c 'ldd --version 2>&1 | head -1' || true
          node scripts/smoke-test.mjs --url http://127.0.0.1:3001 --mode binary

  # Die Installationspakete (#25) werden installiert wie bei einem Nutzer, danach startet
  # Mietfuchs als ganz normaler Benutzer. In /usr/bin darf der nicht schreiben, seine Daten
  # gehören deshalb nach ~/.local/share/mietfuchs (server/src/store.ts). Geprüft wird mit
  # demselben Skript wie jede Programmdatei, und zwar auf je einer Distribution pro Format.
  # Welche Pakete dieser Lauf prüft, entscheidet der Job „Prüfumfang festlegen“ oben.
  pakete:
    name: Paket auf ${{ matrix.name }}
    needs: [umfang, signieren]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.umfang.outputs.pakete) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-binaries
          path: pakete

      - name: Installieren, als Benutzer starten und prüfen
        shell: bash
        run: |
          # --network host: Die Programmdatei erreicht das nachgebaute Ollama des Prüfskripts
          # unter 127.0.0.1, und das Skript erreicht Mietfuchs ebenso.
          docker run -d --name pruefling --network host -v "$PWD/pakete:/pkg:ro" \
            "${{ matrix.image }}" sleep 1800
          trap 'echo "--- Ausgabe von Mietfuchs"; docker exec pruefling cat /tmp/server.log 2>/dev/null; docker rm -f pruefling > /dev/null' EXIT
          docker exec pruefling sh -c '${{ matrix.install }} /pkg/${{ matrix.muster }}'
          docker exec pruefling useradd --create-home pruefer
          # Den Benutzer wechselt Docker selbst: `su` bringen nicht alle Abbilder mit (AlmaLinux
          # 10 etwa nicht). HOME muss dabei ausdrücklich mit, sonst läge der Datenordner falsch.
          docker exec -d --user pruefer \
            -e HOME=/home/pruefer -e CI=true -e NKA_PORT=3001 \
            -e NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test \
            pruefling sh -c 'mietfuchs > /tmp/server.log 2>&1'
          # Betriebsart „package“: Aus einem Paket installiert, erklärt der Update-Hinweis das
          # Aktualisieren über die Paketverwaltung statt über das Austauschen der Datei.
          node scripts/smoke-test.mjs --url http://127.0.0.1:3001 --mode package
          echo '--- Datenordner des Benutzers'
          docker exec pruefling ls -l /home/pruefer/.local/share/mietfuchs/db.json
          # Einmal genügt: Der Startmenü-Eintrag ist in jedem Paket derselbe, und nur Debian
          # und Verwandte bringen das Prüfprogramm dafür mit.
          if [ '${{ matrix.startmenue }}' = 'ja' ]; then
            docker exec pruefling sh -c 'apt-get -qq update && apt-get -qq install -y desktop-file-utils'
            docker exec pruefling desktop-file-validate /usr/share/applications/mietfuchs.desktop
            docker exec pruefling sh -c 'ls /usr/share/icons/hicolor/*/apps/mietfuchs.*'
          fi

          # Zweiter Klick im Startmenü, während Mietfuchs schon läuft: Er darf nicht mit einem
          # Fehler enden, sondern soll nur die Oberfläche öffnen (#45).
          echo '--- Zweiter Start auf demselben Port'
          docker exec --user pruefer             -e HOME=/home/pruefer -e CI=true -e NKA_PORT=3001             -e NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test             pruefling mietfuchs

          # Beenden aus der Oberfläche. Ohne Konsolenfenster ist das der einzige Weg, deshalb
          # wird er auf jeder Programmdatei geprüft.
          echo '--- Beenden über die Oberfläche'
          node -e 'const url = "http://127.0.0.1:3001";
            const gone = async () => { try { await fetch(url + "/healthz"); return false } catch { return true } };
            (async () => {
              const antwort = await (await fetch(url + "/api/quit", { method: "POST" })).json();
              if (!antwort.ok) throw new Error("Unerwartete Antwort: " + JSON.stringify(antwort));
              for (let i = 0; i < 50; i++) { if (await gone()) return console.log("Mietfuchs hat sich beendet"); await new Promise((r) => setTimeout(r, 200)) }
              throw new Error("Mietfuchs läuft nach dem Beenden weiter");
            })()'

  # Eine KI-Auswertung auf dem Prozessor kann länger als fünf Minuten dauern. fetch unter Node und
  # Firefox brechen nach 300 Sekunden ohne Antwort-Header ab (#17). Das nachgebaute Ollama
  # schweigt hier 320 Sekunden; die Auswertung muss trotzdem ankommen. Geprüft wird der Start aus
  # dem Quellcode, also der Weg von npm und Docker-Image; die Programmdateien prüft der Job
  # „Prüfen auf …“ oben unter derselben Bedingung, dort mit Bun statt Node.
  #
  # Der Job stand bis #52 in ci.yml und lief bei jedem PR. Er kostete dort knapp sieben von neun
  # Minuten Wartezeit, hängt aber an der Laufzeit und der HTTP-Schicht statt am Fachcode und
  # ändert sich damit erst mit einer neuen Node- oder Bun-Version. Deshalb läuft er jetzt nur
  # noch beim Tag, beim wöchentlichen Zeitplan, beim Start von Hand und an einem PR mit dem
  # Label „full-check“, also genau dann, wenn auch die volle Matrix läuft.
  slow-ai-answer:
    name: Lange KI-Antwort (Node)
    needs: umfang
    if: needs.umfang.outputs.vollstaendig == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm install
      - run: npm run build
      - name: Auswertung mit 320 Sekunden Wartezeit
        run: |
          NKA_DATA_DIR="$RUNNER_TEMP/daten" NKA_PORT=3001 NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test \
            node server/src/index.ts > server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; echo "--- Ausgabe des Servers"; cat server.log' EXIT
          node scripts/smoke-test.mjs --url http://127.0.0.1:3001 --mode npm --slow-ai 320

  # Nur bei einem echten Tag-Push, und nur wenn alle Prüfungen bestanden sind. Beim Tag läuft
  # auch die lange KI-Antwort, sie gehört deshalb in die Liste: Was hier nicht grün ist, wird
  # nicht ans Release gehängt.
  veroeffentlichen:
    name: Ans Release anhängen
    needs: [pruefen, distributionen, pakete, slow-ai-answer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mietfuchs-binaries
          path: dist-bin
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-bin/*.zip
            dist-bin/*.tar.gz
            dist-bin/*.exe
            dist-bin/*.deb
            dist-bin/*.rpm
            dist-bin/*.pkg.tar.zst
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Ein Tag mit Bindestrich ist nach SemVer eine Vorabversion (v0.8.0-rc.1), und genau so
          # wird das Release dann auch gekennzeichnet.
          #
          # **Das ist eine Sicherung, kein Verfahren.** `prerelease` steht in der action.yml von
          # softprops ohne Automatik auf `false`; ohne diese Zeile erschiene ein
          # Release-Kandidat als vollwertiges Release. Dann lieferte ihn `releases/latest` aus,
          # und jeder Nutzer mit eingeschalteter Update-Prüfung bekäme ihn angeboten (siehe
          # update.ts, das Vorabversionen ausdrücklich überspringt). Solange niemand einen
          # solchen Tag setzt, ändert die Zeile nichts; setzt doch einmal jemand einen, verhindert
          # sie den stillen Fehlgriff.
          #
          # Das Docker-Image braucht nichts dergleichen: `docker/metadata-action` mit
          # `latest=auto` vergibt `latest` bei einer Vorabversion von sich aus nicht.
          prerelease: ${{ contains(github.ref_name, '-') }}
