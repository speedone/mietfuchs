name: Programmfenster

# Probe für das eigene Programmfenster unter Windows und macOS (#517, PR 1): bauen, installieren wie ein Nutzer und von
# außen prüfen (scripts/desktop-check.mjs: Start, Prüfung des Servers, zweiter Start, Beenden, Absturz des Fensters).
# Die Installer und .dmg-Dateien hängen als Artefakt am Lauf, zum Ausprobieren von Hand.
#
# Läuft an PRs, die das Fenster oder seinen Bau ändern, und von Hand. In release.yml kommt es mit PR 2.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/package-desktop.mjs'
      - 'scripts/desktop-check.mjs'
      - 'server/src/version.ts'
      - 'server/src/requestGuard.ts'
      - 'server/src/index.ts'
      - 'server/src/store.ts'
      - 'server/src/paths.ts'
      - 'scripts/package-binaries.mjs'
      - 'scripts/smoke-test.mjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Programmdateien bauen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - name: Programmdateien für Windows (ohne Konsolenfenster) und macOS
        run: |
          for ziel in store-x64 store-arm64 macos-arm64 macos-x64; do node scripts/package-binaries.mjs "$ziel"; done
      - uses: actions/upload-artifact@v7
        with:
          name: fenster-server
          path: |
            dist-bin/store/*.exe
            dist-bin/mietfuchs-macos-apple-silicon
            dist-bin/mietfuchs-macos-intel
          if-no-files-found: error
          retention-days: 3

  bauen:
    name: Bauen (${{ matrix.name }})
    needs: server
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, runner: windows-2025, ziel: win }
          - { name: macOS, runner: macos-15, ziel: mac }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: fenster-server
          path: dist-bin
      - run: npm --prefix desktop ci
      # Die Tests des Fensters auch auf dem System, für das es gebaut wird (Pfade, Ports)
      - run: npm --prefix desktop test
      - name: Programmfenster bauen
        run: node scripts/package-desktop.mjs ${{ matrix.ziel }}
      - uses: actions/upload-artifact@v7
        with:
          name: fenster-${{ matrix.ziel }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
          if-no-files-found: error
          retention-days: 14

  pruefen:
    name: Prüfen auf ${{ matrix.name }}
    needs: bauen
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-2025, ziel: win }
          - { name: Windows ARM64, runner: windows-11-arm, ziel: win }
          - { name: macOS Apple Silicon, runner: macos-15, ziel: mac, arch: arm64 }
          - { name: macOS Intel, runner: macos-15-intel, ziel: mac, arch: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: fenster-${{ matrix.ziel }}
          path: paket
      - name: Installieren wie ein Nutzer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem paket\*.exe | Select-Object -First 1
          "Installer: $($setup.Name), $([math]::Round($setup.Length / 1MB, 1)) MB" | Tee-Object -Append groessen.txt
          # Still installieren, für den Benutzer, ohne Adminrechte
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          # Der Ordner heißt wie das Paket (desktop/package.json, `name`)
          $dir = "$env:LOCALAPPDATA\Programs\mietfuchs"
          $exe = Join-Path $dir 'Mietfuchs.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 | Out-Host; throw "$exe nach der Installation nicht gefunden" }
          "Installiert: $dir, $([math]::Round((Get-ChildItem $dir -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB" | Tee-Object -Append groessen.txt
          # Startet der Installer das Programm danach, belegte es den Port der Prüfung: bis zu 20 Sekunden darauf warten
          # und es dann beenden, samt dem Server, den es gestartet hat
          for ($i = 0; $i -lt 20; $i++) {
            if (Get-Process Mietfuchs -ErrorAction SilentlyContinue) { break }
            Start-Sleep -Seconds 1
          }
          Get-Process Mietfuchs, mietfuchs -ErrorAction SilentlyContinue | Stop-Process -Force
          "APP=$exe" >> $env:GITHUB_ENV
      - name: Installieren wie ein Nutzer (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls paket/*-${{ matrix.arch }}.dmg)
          echo "Abbild: $(basename "$dmg"), $(du -m "$dmg" | cut -f1) MB" | tee -a groessen.txt
          hdiutil attach "$dmg" -nobrowse -mountpoint "$RUNNER_TEMP/abbild"
          mkdir -p "$RUNNER_TEMP/Programme"
          cp -R "$RUNNER_TEMP/abbild/Mietfuchs.app" "$RUNNER_TEMP/Programme/"
          hdiutil detach "$RUNNER_TEMP/abbild"
          app="$RUNNER_TEMP/Programme/Mietfuchs.app"
          echo "Installiert: $(du -sm "$app" | cut -f1) MB" | tee -a groessen.txt
          # Ad hoc signiert, auch die Programmdatei des Servers; ohne gültige Signatur startet auf Apple Silicon nichts
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app/Contents/MacOS/mietfuchs-server" 2>&1 | grep -E 'Signature|Identifier'
          echo "APP=$app/Contents/MacOS/Mietfuchs" >> "$GITHUB_ENV"
      - name: Starten und prüfen
        run: node scripts/desktop-check.mjs --app "${{ env.APP }}" --out fenster-pruefung
      - name: Bericht in die Zusammenfassung
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo '```'
            cat groessen.txt 2>/dev/null || true
            cat fenster-pruefung/bericht.json 2>/dev/null || echo 'kein Bericht'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fenster-pruefung-${{ matrix.runner }}
          path: fenster-pruefung
          retention-days: 14
