name: Docker-Image

# Baut das Container-Image und veröffentlicht es in der GitHub Container Registry,
# damit Mietfuchs sich ohne Clone des Repos starten lässt (`docker pull`).
# Läuft bei einem Tag wie v0.3.0, bei Pushes auf main (Tag `main`) und von Hand. Bei PRs, die
# das Image betreffen, wird nur zur Probe gebaut, ohne Anmeldung und ohne Veröffentlichung.
# So fällt ein kaputter Build vor dem Merge auf und nicht erst auf main.
#
# Sichtbarkeit: Das Package übernimmt die des öffentlichen Repos — seit dem ersten Push
# (v0.3.0) ist es ohne Login abrufbar, ein manueller Freigabeschritt war nicht nötig.
# Prüfen lässt sich das anonym über
#   curl "https://ghcr.io/token?scope=repository:speedone/mietfuchs:pull"
# (liefert ein Token, mit dem /v2/speedone/mietfuchs/manifests/latest antwortet).
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - '**/package.json'
      - '**/package-lock.json'
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Runner bewusst anpinnen (wie im Release-Workflow) — reproduzierbare Builds.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # QEMU für den arm64-Build (Apple Silicon, Raspberry Pi, ARM-NAS) auf einem x64-Runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kleinbuchstaben erzwingen: Image-Namen in Registries dürfen keine Großbuchstaben
      # enthalten, GitHub-Namen schon.
      - name: Image-Name bestimmen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Tags: vX.Y.Z → X.Y.Z + X.Y + latest, main → main. PRs bekommen pr-N, damit der
      # Probebau einen Namen hat. Veröffentlicht wird er nicht.
      - name: Tags und Labels ableiten
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # latest=auto ist der Standard, aber ausdrücklich gesetzt — sonst könnte ein
          # Versionssprung der Action den dokumentierten Tag-Satz still verändern.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Mietfuchs
            org.opencontainers.image.description=Lokales Web-Tool für die Nebenkostenabrechnung privater Vermieter

      - name: Bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
