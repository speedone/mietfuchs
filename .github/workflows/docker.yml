name: Docker-Image

# Baut das Container-Image und veröffentlicht es in der GitHub Container Registry,
# damit Mietfuchs sich ohne Clone des Repos starten lässt (`docker pull`).
# Läuft bei einem Tag wie v0.3.0, bei Pushes auf main (Tag `main`) und von Hand.
#
# Hinweis: Das Package ist beim allerersten Push privat. Einmalig in den
# Repo-/Package-Einstellungen auf „public" stellen, sonst verlangt `docker pull` ein Login.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Runner bewusst anpinnen (wie im Release-Workflow) — reproduzierbare Builds.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # QEMU für den arm64-Build (Apple Silicon, Raspberry Pi, ARM-NAS) auf einem x64-Runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kleinbuchstaben erzwingen: Image-Namen in Registries dürfen keine Großbuchstaben
      # enthalten, GitHub-Namen schon.
      - name: Image-Name bestimmen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Tags: vX.Y.Z → X.Y.Z + X.Y + latest, main → main
      - name: Tags und Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # latest=auto ist der Standard, aber ausdrücklich gesetzt — sonst könnte ein
          # Versionssprung der Action den dokumentierten Tag-Satz still verändern.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Mietfuchs
            org.opencontainers.image.description=Lokales Web-Tool für die Nebenkostenabrechnung privater Vermieter

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
