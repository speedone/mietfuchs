name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ausdrücklich das Wenigste, wie in den übrigen Workflows. Ohne diesen Block bekäme der
# GITHUB_TOKEN die Voreinstellung des Repos, und die kann schreibend sein: Ein Schritt, der
# einmal etwas Fremdes ausführt (eine Action, eine Abhängigkeit), hätte damit Schreibrecht auf
# das Repo. Dieser Workflow baut und testet nur, er braucht nichts als Lesen.
permissions:
  contents: read

jobs:
  test-build:
    name: Tests und Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # 24.15 ist die Mindestversion (engines in package.json). Zwei Gründe kommen dort zusammen:
    # Ab 24.12 gilt das Ausführen von TypeScript ohne Build-Schritt als stabil, und ab 24.15
    # meldet `node:sqlite` beim Laden keine ExperimentalWarning mehr. 24 ist die Version von
    # Docker-Image und Release-Build. Beide müssen grün sein.
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          # Für den Vergleich mit dem Ziel des PR (Schritt „Umfang“) die ganze Geschichte
          fetch-depth: 0
      # Ein PR, der nur Markdown ändert (Changelog, CLAUDE.md, Doku), braucht keinen Build: Es laufen nur die
      # Server-Tests, denn einige lesen Changelog und READMEs (calibration.test.ts, migrations.test.ts, die
      # Golden-Tests). Die Prüfung bleibt Pflicht und heißt gleich, damit die Regel „main schützen“ greift.
      # Ein Push auf main prüft immer alles.
      - name: Umfang
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qv '\.md$'; then
            echo "Nur Markdown geändert: nur die Server-Tests."
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # postinstall installiert server/ und client/ aus eigenen Lockfiles. Ohne diese
          # Angabe hinge der Cache nur am Lockfile im Root.
          cache-dependency-path: '**/package-lock.json'
      # npm install (nicht ci): postinstall installiert Server + Client mit.
      - run: npm install
      # Das Programmfenster (#517) installiert npm install nicht mit; die Typprüfung verlangt es in der CI
      - name: Programmfenster installieren
        if: steps.scope.outputs.docs != 'true'
        run: npm --prefix desktop ci
      - name: Typen prüfen
        if: steps.scope.outputs.docs != 'true'
        run: npm run typecheck
      # Tests der Berechnungs-Engine (node:test) und der Oberfläche (vitest)
      - run: npm test
        if: steps.scope.outputs.docs != 'true'
      - name: Server-Tests (nur Markdown geändert)
        if: steps.scope.outputs.docs == 'true'
        run: npm run test:server
      # Typecheck (tsc --noEmit) + Vite-Build
      - run: npm run build
        if: steps.scope.outputs.docs != 'true'
      # Derselbe Test von außen wie für Programmdateien und Docker-Image (#22), hier gegen den
      # Start aus dem Quellcode. So läuft das Prüfskript bei jedem PR mit.
      - name: Von außen prüfen (Start aus dem Quellcode)
        if: steps.scope.outputs.docs != 'true'
        run: |
          NKA_DATA_DIR="$RUNNER_TEMP/daten" NKA_PORT=3001 NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test \
            node server/src/index.ts > server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; echo "--- Ausgabe des Servers"; cat server.log' EXIT
          node scripts/smoke-test.mjs --url http://127.0.0.1:3001 --mode npm

# Die Prüfung „Lange KI-Antwort (Node)“ stand früher hier und läuft seit #52 in
# .github/workflows/release.yml: beim Tag, wöchentlich nach Zeitplan, beim Start von Hand und an
# einem Pull Request mit dem Label „full-check“. Sie kostete knapp sieben von neun Minuten
# Wartezeit je PR und hängt an der Laufzeit und der HTTP-Schicht, nicht am Fachcode, ändert sich
# also erst mit einer neuen Node- oder Bun-Version. Alles, was ein PR auslässt, steht deshalb in
# einer Datei beisammen, und der wöchentliche Lauf dort ist das Netz dafür.
