name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    name: Tests und Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # 24.12 ist die Mindestversion (engines in package.json): Erst ab dort gilt das Ausführen
    # von TypeScript ohne Build-Schritt als stabil. 24 ist die Version von Docker-Image und
    # Release-Build. Beide müssen grün sein.
    strategy:
      fail-fast: false
      matrix:
        node: ['24.12', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # postinstall installiert server/ und client/ aus eigenen Lockfiles. Ohne diese
          # Angabe hinge der Cache nur am Lockfile im Root.
          cache-dependency-path: '**/package-lock.json'
      # npm install (nicht ci): postinstall installiert Server + Client mit.
      - run: npm install
      - name: Typen prüfen
        run: npm run typecheck
      # Tests der Berechnungs-Engine (node:test)
      - run: npm test
      # Typecheck (tsc --noEmit) + Vite-Build
      - run: npm run build
      # Derselbe Test von außen wie für Programmdateien und Docker-Image (#22), hier gegen den
      # Start aus dem Quellcode. So läuft das Prüfskript bei jedem PR mit.
      - name: Von außen prüfen (Start aus dem Quellcode)
        run: |
          NKA_DATA_DIR="$RUNNER_TEMP/daten" NKA_PORT=3001 NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test \
            node server/src/index.ts > server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; echo "--- Ausgabe des Servers"; cat server.log' EXIT
          node scripts/smoke-test.mjs --url http://127.0.0.1:3001 --mode npm

  # Eine KI-Auswertung auf dem Prozessor kann länger als fünf Minuten dauern. fetch unter Node und
  # Firefox brechen nach 300 Sekunden ohne Antwort-Header ab (#17). Das nachgebaute Ollama schweigt
  # hier 320 Sekunden; die Auswertung muss trotzdem ankommen. Läuft parallel zu den Tests.
  slow-ai-answer:
    name: Lange KI-Antwort (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm install
      - run: npm run build
      - name: Auswertung mit 320 Sekunden Wartezeit
        run: |
          NKA_DATA_DIR="$RUNNER_TEMP/daten" NKA_PORT=3001 NKA_UPDATE_URL=http://127.0.0.1:9/kein-internet-im-test \
            node server/src/index.ts > server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; echo "--- Ausgabe des Servers"; cat server.log' EXIT
          node scripts/smoke-test.mjs --url http://127.0.0.1:3001 --mode npm --slow-ai 320
