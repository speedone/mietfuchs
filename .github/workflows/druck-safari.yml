name: Druck in Safari

# Druck und PDF der Nebenkostenabrechnung in Safari (WebKit unter macOS), automatisch statt von Hand (#286).
# Playwright druckt mit WebKit unter Linux nicht, deshalb ein Mac: WKWebView mit NSPrintOperation, wie „Als PDF
# sichern“, daneben Chromium als Vergleich auf demselben Rechner, ausgewertet mit pdf.js
# (scripts/safari-print-check.mjs, das Swift-Programm in scripts/safari-print/). Bericht in der Zusammenfassung des
# Laufs, PDFs und Seitenbilder als Artefakt.
#
# Vorerst nur von Hand startbar und nicht Teil von release.yml: Ob und wie der Lauf in den vollen Prüfumfang kommt,
# wird nach den Probeläufen entschieden. `macos-latest` mit Absicht: Geprüft werden soll das Safari, das Nutzer haben.
#
# Melden, nicht scheitern: Die ersten Läufe fanden echte Befunde (keine Seitenzahl, kein Fußvermerk, keine
# wiederholten Tabellenköpfe in WebKit; scripts/CLAUDE.md, Browserlauf). Bis sie behoben sind, bleibt der Lauf mit
# Befunden grün und meldet sie als Warnung über dem Lauf und als Bericht in der Zusammenfassung. Rot wird er, wenn die
# Prüfung selbst scheitert (Exit 2: Server, Druck oder Auswertung kaputt), denn dann gibt es keinen Bericht.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    name: Druck in Safari (WebKit)
    runs-on: macos-latest
    # Im Probelauf rund vier Minuten; ein hängender Druck soll den Runner nicht sechs Stunden halten
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm install
      - run: npm run build
      - run: npx playwright install chromium
      - name: Fassungen von macOS, Safari und Swift
        run: |
          {
            echo "macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m)"
            echo "Safari $(defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString), WebKit $(defaults read /System/Library/Frameworks/WebKit.framework/Resources/Info CFBundleVersion 2>/dev/null || echo unbekannt)"
            swiftc --version 2>&1 | head -1
          } | tee fassungen.txt
      - name: Swift-Programm übersetzen
        run: swiftc -O scripts/safari-print/main.swift -o "$RUNNER_TEMP/safari-print"
      - name: Drucken und prüfen
        run: |
          code=0
          node scripts/safari-print-check.mjs --out "$RUNNER_TEMP/druck-safari" --safari-bin "$RUNNER_TEMP/safari-print" || code=$?
          # Exit 1 gilt nur als Befund, wenn der Bericht da ist und mindestens einen nennt. Node endet auch bei einer
          # nicht abgefangenen Ausnahme mit 1; ohne diese Probe würde ein kaputter Lauf still grün.
          anzahl=0
          if [ -f "$RUNNER_TEMP/druck-safari/bericht.md" ]; then
            anzahl=$(grep -c '^- \*\*' "$RUNNER_TEMP/druck-safari/bericht.md" || true)
          fi
          if [ "$code" = 1 ] && [ "$anzahl" -gt 0 ]; then
            echo "::warning title=Druck in Safari::$anzahl Befund(e), siehe Zusammenfassung des Laufs (vorerst gemeldet, nicht gescheitert)"
            exit 0
          fi
          if [ "$code" = 1 ]; then echo "::error title=Druck in Safari::Exit 1 ohne Befund im Bericht, der Lauf ist gescheitert"; fi
          exit "$code"
      - name: Bericht in die Zusammenfassung
        if: always()
        run: |
          {
            if [ -f "$RUNNER_TEMP/druck-safari/bericht.md" ]; then cat "$RUNNER_TEMP/druck-safari/bericht.md"; else echo "# Druck in Safari: kein Bericht (Lauf vorher abgebrochen, siehe Protokoll)"; fi
            echo
            echo '```'
            cat fassungen.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/druck-safari"
          cp fassungen.txt "$RUNNER_TEMP/druck-safari/" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: druck-safari
          path: ${{ runner.temp }}/druck-safari
          if-no-files-found: error
          # PDFs und rund 70 Seitenbilder je Lauf; zum Nachsehen reichen zwei Wochen
          retention-days: 14
