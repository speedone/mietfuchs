# Hält Abhängigkeiten aktuell, einmal im Monat. Die CI prüft jeden PR wie jeden anderen,
# Programmdateien und Docker-Image laufen dabei durch die Artefakt-Tests (#22). Wenn alles grün
# ist, reicht ein Merge.
version: 2
updates:
  # GitHub Actions der Workflows: alle Updates gebündelt in einem PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # npm-Pakete in allen drei Ordnern (#23). Kleine Updates kommen gebündelt, Hauptversionen
  # einzeln, weil sie oft Anpassungen brauchen und sich so gezielt prüfen lassen.
  # Sicherheitsupdates kommen unabhängig davon sofort.
  - package-ecosystem: npm
    directories:
      - /
      - /server
      - /client
    schedule:
      interval: monthly
    groups:
      # Tailwind (nur im Client, #346) kommt immer zusammen, auch bei Hauptversionen:
      # @tailwindcss/vite verlangt genau die eigene Fassung von tailwindcss, und einzeln läge
      # sonst ein zweites tailwindcss verschachtelt daneben. Steht vor `kleine-updates`, weil
      # Dependabot ein Paket der ersten passenden Gruppe zuordnet.
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
      kleine-updates:
        patterns: ['*']
        update-types: [minor, patch]
    # Die Typen von Node folgen der Node-Version, mit der Mietfuchs läuft (engines, Docker,
    # Release-Build). Mit den Typen einer neueren Hauptversion ließe der Übersetzer Funktionen
    # durch, die es zur Laufzeit nicht gibt. Angehoben wird zusammen mit Node (scripts/CLAUDE.md,
    # Node-Versionen), nicht von Dependabot.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
