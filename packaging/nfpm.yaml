# Bauvorschrift für die Linux-Installationspakete (#25): .deb, .rpm und das Paket für Arch
# Linux entstehen mit nFPM aus derselben Programmdatei, die auch als Archiv im Release liegt.
# Gebaut wird über scripts/package-linux.mjs; dort werden PKG_ARCH und PKG_VERSION gesetzt und
# die passende Programmdatei nach dist-bin/stage/mietfuchs gelegt.
#
# Das Paket legt nur vier Dateien ab: das Programm, den Startmenü-Eintrag und zwei Symbole.
# Einen Dienst richtet es bewusst nicht ein. Mietfuchs läuft, wenn jemand ihn startet, und
# hält keine Daten bereit, solange niemand damit arbeitet.
name: mietfuchs
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
section: utils
priority: optional
maintainer: speedone <speedone@users.noreply.github.com>
vendor: Mietfuchs
homepage: https://github.com/speedone/mietfuchs
license: MIT
description: |
  Nebenkostenabrechnung für private Vermieter
  Mietfuchs rechnet die Betriebskosten eines kleinen Mehrfamilienhauses ab: Umlage nach
  Fläche, Personen, Wohneinheiten oder Verbrauch, Mietkonto, Belege und eine Übersicht für
  die Anlage V. Alles läuft auf diesem Rechner, ohne Konto und ohne Cloud.

contents:
  - src: dist-bin/stage/mietfuchs
    dst: /usr/bin/mietfuchs
    file_info:
      mode: 0755
  # Die Rechte stehen ausdrücklich hier: Sonst übernähme nFPM die der Quelldatei, und die hängen
  # am Rechner, auf dem gebaut wird (ein Windows-Arbeitsverzeichnis liefert 0775).
  - src: packaging/mietfuchs.desktop
    dst: /usr/share/applications/mietfuchs.desktop
    file_info:
      mode: 0644
  - src: packaging/mietfuchs.svg
    dst: /usr/share/icons/hicolor/scalable/apps/mietfuchs.svg
    file_info:
      mode: 0644
  # Umgebungen ohne SVG-Unterstützung greifen auf das PNG zurück; es ist dasselbe Symbol.
  - src: client/public/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/mietfuchs.png
    file_info:
      mode: 0644
